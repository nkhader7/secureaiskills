severity = "Low"
category = "CIS Kubernetes Benchmark"
description = "Verify the Kubernetes environment satisfies this benchmark control: Ensure that the API server pod specification file permissions are set to 600 or more restrictive."
match_strategy = "cis_kubernetes_review"
remediation = "Apply the CIS Kubernetes Benchmark recommendation for 1.1.1; update manifests, component flags, RBAC objects, admission policies, or node configuration as needed."

