  |-------|-------|

  | Skill | scan-toml-security |

  | Target | {{target}} |

  | Date | {{date}} |

  | Branch | {{branch}} |

  | Files Reviewed | {{file_count}} |

  | Findings | {{total_findings}} |

  | Overall Severity | {{overall_severity}} |


  ---


  ## Findings


  {{#each findings}}

  ### [{{severity}}] {{rule_id}} - {{rule_name}}


  **File:** `{{file}}` (line {{line}})

  **Category:** {{category}}

  **Description:** {{description}}


  ```toml

  {{snippet}}

  ```


  **Remediation:** {{remediation}}


  ---

  {{/each}}


  {{#if no_findings}}

  No TOML security issues were detected in the reviewed files.

  {{/if}}


