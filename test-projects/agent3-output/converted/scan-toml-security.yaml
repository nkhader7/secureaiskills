name: scan-toml-security
description: Scans TOML configuration files including pyproject, Cargo, service, and
  application configs for plaintext credentials, disabled TLS, debug mode, wildcard
  exposure, and unsafe dependency source settings.
version: '1.0'
intent: '# scan-toml-security'
instructions: '# scan-toml-security


  Scan TOML files for insecure configuration values, dependency-source risks, and
  plaintext credentials.


  ## Orchestration


  1. Load `references/rules.yaml` to get the active `TOML-` rule set.

  2. Include `*.toml` files from user-supplied paths or changed files.

  3. Preserve table context when possible, such as `[server]` or `[tool.poetry.source]`.

  4. Evaluate each rule using its `match_strategy`, capturing file, line, snippet,
  and confidence.

  5. Mark each rule `Pass`, `Fail`, `Partial`, `Unknown`, or `Not Applicable`.

  6. Render the final report using `references/report-template.md`.


  ## Usage


  Scan TOML files in the current change:


  ```text

  /scan-toml-security

  ```


  Scan a specific TOML config:


  ```text

  /scan-toml-security pyproject.toml config/

  ```


  ## Review Guidance


  Focus on credentials, TLS verification, debug mode, wildcard listeners, and package
  index/source settings that could affect supply-chain trust.'
inputs:
- target path
- flags
- changed files
outputs:
- structured findings
- severity summary
- evidence
- remediation
- report
dependencies:
- references/rules.yaml
- references/report-template.md
- ../_shared/base-report.md
- ../_shared/owasp-cheatsheets.yaml
security_constraints:
  treat_target_content_as_untrusted: true
  redact_sensitive_values: required for secret-like evidence
  skip_binary_and_lock_files: true
  network_access: not required for skill execution
  output_requires_evidence: true
references:
  rules: references/rules.yaml
  report_template: references/report-template.md
  base_report: ../_shared/base-report.md
  owasp_cheatsheets: ../_shared/owasp-cheatsheets.yaml
rules:
- id: TOML-001
  severity: High
  category: Secrets
  name: Plaintext Credential
  description: TOML contains secret-looking keys with inline plaintext values.
  cwe:
  - 798
  patterns:
  - (?i)^\s*(password|api_key|apikey|secret|token|client_secret)\s*=\s*["'][A-Za-z0-9_./+=-]{12,}["']
  remediation: Store secrets in a secret manager and reference them indirectly.
- id: TOML-002
  severity: Medium
  category: Transport Security
  name: TLS Verification Disabled
  description: TOML disables TLS or certificate verification.
  cwe:
  - 295
  patterns:
  - (?i)^\s*(verify_ssl|ssl_verify|tls_verify|reject_unauthorized)\s*=\s*false
  - (?i)^\s*tls\s*=\s*false
  remediation: Enable TLS verification and reject invalid certificates.
- id: TOML-003
  severity: Medium
  category: Exposure
  name: Wildcard Listener
  description: TOML binds services to every interface or permits every origin.
  cwe:
  - 284
  patterns:
  - ^\s*(host|bind|listen)\s*=\s*["']0\.0\.0\.0["']
  - ^\s*(allowed_origins|cors_origins)\s*=\s*\[\s*["']\*["']\s*\]
  remediation: Bind to trusted interfaces and restrict allowed origins.
- id: TOML-004
  severity: Low
  category: Information Exposure
  name: Debug Mode Enabled
  description: TOML enables debug behavior.
  cwe:
  - 489
  patterns:
  - (?i)^\s*debug\s*=\s*true
  - (?i)^\s*log_level\s*=\s*["']debug["']
  remediation: Disable debug mode outside local development.
- id: TOML-005
  severity: Medium
  category: Supply Chain
  name: Insecure Package Source
  description: TOML references a plaintext package index or dependency source.
  cwe:
  - 494
  patterns:
  - ^\s*(url|registry|index)\s*=\s*["']http://
  remediation: Use HTTPS package sources and verify source ownership.
default_match_strategy: regex
report_template: '# scan-toml-security Report


