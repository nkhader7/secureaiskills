# scan-security-headers fixture — Intentionally vulnerable — do not deploy

server {
  # SHD: HTTP only — no HTTPS redirect, no HSTS
  listen 80;

  # SHD: missing Strict-Transport-Security header
  # SHD: missing Content-Security-Policy header
  # SHD: missing X-Frame-Options header
  # SHD: missing X-Content-Type-Options header
  # SHD: missing Referrer-Policy header
  # SHD: missing Permissions-Policy header

  # SHD: information disclosure via Server/X-Powered-By
  add_header X-Powered-By "Express/4.17.1";
  server_tokens on;

  # SHD: wildcard CORS with credentials
  add_header Access-Control-Allow-Origin "*";
  add_header Access-Control-Allow-Credentials "true";
  add_header Access-Control-Allow-Methods "*";

  # SHD: unsafe-inline and unsafe-eval in CSP (if set)
  add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:";

  # SHD: caching sensitive responses
  add_header Cache-Control "public, max-age=86400";

  location / {
    proxy_pass http://127.0.0.1:3000;
    # SHD: no proxy headers stripping (X-Forwarded-For spoofable)
  }
}
