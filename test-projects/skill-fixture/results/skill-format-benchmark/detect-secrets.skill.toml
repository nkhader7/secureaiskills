[skill]
name = "detect-secrets"
description = "Detects hardcoded secrets, credentials, and sensitive tokens committed to source code"
triggers = ["/detect-secrets", "detect.*secret", "secret.*detect", "find.*credential", "scan.*token"]
body = """
# detect-secrets

Detects hardcoded secrets, API keys, private keys, tokens, and credentials that should never appear in source code.

## Orchestration

1. Load `references/rules.yaml` to get the active rule set and its `default_match_strategy`.
2. Load `../_shared/owasp-cheatsheets.yaml` and use the mapped OWASP cheat sheets to support remediation guidance and references.
3. Identify files to scan — default to changed files on the current branch (`git diff main...HEAD --name-only`); scan all tracked files when a path argument is provided.
4. Skip binary files, lock files (`package-lock.json`, `*.lock`), and files listed in `.gitignore`.
5. Select rules before scanning when the target is large:
   - Always include custom `DS-` rules.
   - Include provider-specific rules when filenames, imports, environment variable names, or nearby text indicate that provider or technology.
   - For broad `--all` scans, run high-confidence credential formats first, then expand to lower-confidence rules if findings or target context justify it.
6. For each file, evaluate every line against each rule's `patterns` using `default_match_strategy: regex` unless a rule overrides it.
7. For each match, capture the file path, line number, rule ID, and a masked snippet (replace the matched secret value with `***REDACTED***`).
8. Aggregate findings by severity (Critical → High → Medium → Low → Info).
9. Render the final report using `references/report-template.md`.

## Usage

Scan changed files on the current branch:

```text
/detect-secrets
```

Scan a specific path or directory:

```text
/detect-secrets src/config/
```

Scan all tracked files in the repository:

```text
/detect-secrets --all
```

## OWASP Cheat Sheets

Use the shared mapping in `../_shared/owasp-cheatsheets.yaml` for authoritative OWASP Cheat Sheet Series references that match this skill. Include the relevant cheat sheet links in the report when they directly support a finding or remediation.
"""
report_template = """
# detect-secrets Report

| Field | Value |
|-------|-------|
| Skill | detect-secrets |
| Target | {{target}} |
| Date | {{date}} |
| Branch | {{branch}} |
| Files Scanned | {{file_count}} |
| Secrets Found | {{total_findings}} |
| Overall Severity | {{overall_severity}} |

---

## Findings

{{#each findings}}
### [{{severity}}] {{rule_id}} — {{rule_name}}

**File:** `{{file}}` (line {{line}})
**Category:** {{category}}
**Description:** {{description}}

```text
{{snippet_masked}}
```

**Remediation:** {{remediation}}

---
{{/each}}

{{#if no_findings}}
No secrets or credentials were detected in the scanned files.
{{/if}}

## Summary Table

| Severity | Count |
|----------|-------|
| Critical | {{count_critical}} |
| High     | {{count_high}} |
| Medium   | {{count_medium}} |
| Low      | {{count_low}} |
| Info     | {{count_info}} |

## Immediate Actions

- **Rotate every Critical and High secret now** — assume any committed secret is compromised, regardless of whether the branch was merged.
- Check `git log --all -S "<secret>"` to confirm whether the secret appears in earlier commits; if so, rewrite history with `git filter-repo`.
- Add detected file types or variable names to `.gitignore` and pre-commit hooks (e.g., `detect-secrets`, `trufflehog`) to prevent recurrence.
- **Medium** and **Low** findings should be reviewed and remediated before the next release.

"""

[skill.references]
rules = "references/rules.yaml"
report_template = "references/report-template.md"
base_report = "../_shared/base-report.md"
owasp_cheatsheets = "../_shared/owasp-cheatsheets.yaml"

[rules]
version = "1.0"
default_match_strategy = "regex"

[[rules.items]]
id = "DS-001"
severity = "Critical"
category = "Cloud Credentials"
name = "AWS Access Key"
description = "AWS Access Key ID followed by a Secret Access Key in the same file"
remediation = "Revoke the key immediately in AWS IAM. Rotate and store in AWS Secrets Manager or environment variables."
patterns = ["AKIA[0-9A-Z]{16}", "ASIA[0-9A-Z]{16}", "aws_access_key_id\\s*=\\s*['\"]?AKIA[0-9A-Z]{16}", "aws_secret_access_key\\s*=\\s*['\"]?[A-Za-z0-9/+=]{40}"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-002"
severity = "Critical"
category = "Cloud Credentials"
name = "GCP Service Account Key"
description = "Google Cloud service account private key embedded in source"
remediation = "Delete the service account key in GCP IAM. Use Workload Identity Federation or Secret Manager instead."
patterns = ["\"type\":\\s*\"service_account\"", "\"private_key\":\\s*\"-----BEGIN", "GOOGLE_APPLICATION_CREDENTIALS.*\\.json"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-003"
severity = "Critical"
category = "Cloud Credentials"
name = "Azure Client Secret"
description = "Azure client secret or storage account key in source"
remediation = "Rotate the secret in Azure AD / Azure Portal. Use Azure Key Vault or managed identities."
patterns = ["AZURE_CLIENT_SECRET\\s*=\\s*['\"][^'\"]{20,}", "DefaultEndpointsProtocol=https;AccountName=.*AccountKey=[A-Za-z0-9+/=]{80,}", "client_secret\\s*=\\s*['\"][A-Za-z0-9~._\\-]{30,}"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-004"
severity = "Critical"
category = "Private Keys"
name = "Private Key Material"
description = "PEM-encoded private key block (RSA, EC, DSA, OpenSSH)"
remediation = "Revoke and regenerate the key pair. Never commit private keys \u00e2\u20ac\u201d use a secrets manager or hardware token."
patterns = ["-----BEGIN RSA PRIVATE KEY-----", "-----BEGIN EC PRIVATE KEY-----", "-----BEGIN DSA PRIVATE KEY-----", "-----BEGIN OPENSSH PRIVATE KEY-----", "-----BEGIN PRIVATE KEY-----"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-005"
severity = "Critical"
category = "Payment"
name = "Stripe Secret Key"
description = "Stripe live or test secret API key"
remediation = "Roll the key immediately in the Stripe Dashboard. Use environment variables; never commit payment credentials."
patterns = ["sk_live_[A-Za-z0-9]{24,}", "sk_test_[A-Za-z0-9]{24,}", "rk_live_[A-Za-z0-9]{24,}"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-006"
severity = "High"
category = "Version Control"
name = "GitHub Personal Access Token"
description = "GitHub classic or fine-grained personal access token"
remediation = "Revoke the token at github.com/settings/tokens. Rotate and store in a secrets manager or CI secrets store."
patterns = ["ghp_[A-Za-z0-9]{36}", "github_pat_[A-Za-z0-9_]{82}", "gho_[A-Za-z0-9]{36}", "ghs_[A-Za-z0-9]{36}"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-007"
severity = "High"
category = "Communication"
name = "Slack Token"
description = "Slack bot, app, or legacy token in source"
remediation = "Revoke the token in the Slack app management console. Use environment variables or a secrets manager."
patterns = ["xoxb-[0-9A-Za-z\\-]{50,}", "xoxp-[0-9A-Za-z\\-]{50,}", "xoxa-[0-9A-Za-z\\-]{50,}", "xoxs-[0-9A-Za-z\\-]{50,}"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-008"
severity = "High"
category = "Cloud Credentials"
name = "Generic API Key Assignment"
description = "Variable named after a key or token assigned a high-entropy string literal"
remediation = "Move the value to an environment variable or secrets manager and reference it at runtime."
patterns = ["(api_key|apikey|api_token|access_token|auth_token)\\s*=\\s*['\"][A-Za-z0-9_\\-]{20,}['\"]", "(API_KEY|API_TOKEN|ACCESS_TOKEN|AUTH_TOKEN)\\s*=\\s*['\"][A-Za-z0-9_\\-]{20,}['\"]"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-009"
severity = "High"
category = "Authentication"
name = "Database Connection String with Password"
description = "Database DSN or connection string containing an inline password"
remediation = "Externalize the connection string to environment variables or a secrets manager. Use IAM authentication where supported."
patterns = ["(mysql|postgresql|postgres|mongodb|mssql|redis)://[^:]+:[^@]{4,}@", "password=[^;\\s&]{4,}", "Password=[^;\\s&]{4,}"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-010"
severity = "High"
category = "Authentication"
name = "Bearer Token in Code"
description = "Hard-coded Bearer token string"
remediation = "Obtain tokens at runtime via an auth flow. Never hard-code bearer tokens."
patterns = ["Bearer [A-Za-z0-9\\-._~+/]{20,}", "authorization.*Bearer [A-Za-z0-9\\-._~+/]{20,}"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-011"
severity = "Medium"
category = "Authentication"
name = "Generic Password Assignment"
description = "Variable named password assigned a non-empty string literal"
remediation = "Use environment variables or a secrets manager. If this is a test fixture, ensure it cannot reach production."
patterns = ["(password|passwd|pwd)\\s*=\\s*['\"][^'\"]{4,}['\"]", "(PASSWORD|PASSWD|PWD)\\s*=\\s*['\"][^'\"]{4,}['\"]"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-012"
severity = "Medium"
category = "Configuration"
name = "Committed .env File"
description = "A .env file containing key=value pairs has been committed"
remediation = "Add .env files to .gitignore. Use .env.example with placeholder values for documentation."
patterns = ["^\\.env$", "^\\.env\\.(local|production|staging|development)$"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "DS-013"
severity = "Low"
category = "Authentication"
name = "Potential JWT"
description = "String matching JWT structure (three base64url segments separated by dots)"
remediation = "Verify whether this is a live token. If so, invalidate it and remove from source. JWTs belong in runtime config, not code."
patterns = ["eyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}"]
[rules.items.source]
project = "nkhader7/secureaiskills"
path = "skills/detect-secrets/references/rules.yaml"
url = "https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml"

[[rules.items]]
id = "GITLEAKS-1PASSWORD-SECRET-KEY"
severity = "Medium"
category = "API Key"
name = "1password Secret Key"
description = "Uncovered a possible 1Password secret key, potentially compromising access to secrets in vaults."
remediation = "Revoke and rotate this credential immediately. Store secrets in a secrets manager, not in source code."
patterns = ["\\bA3-[A-Z0-9]{6}-(?:(?:[A-Z0-9]{11})|(?:[A-Z0-9]{6}-[A-Z0-9]{5}))-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}\\b"]
[rules.items.source]
project = "gitleaks/gitleaks"
path = "config/gitleaks.toml"
url = "https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml"

[[rules.items]]
