name = "scan-for-ssrf"
description = "Detects Server-Side Request Forgery (SSRF) vulnerabilities including user-controlled HTTP sinks, cloud metadata endpoint access, internal network probing, and unsafe redirect patterns. Use when reviewing code that makes outbound HTTP requests, fetches remote URLs, or accepts hostnames from user input."
version = "1.0"
intent = "# scan-for-ssrf"
inputs = ["target path", "flags", "changed files"]
outputs = ["structured findings", "severity summary", "evidence", "remediation", "report"]
dependencies = ["references/rules.yaml", "references/report-template.md", "../_shared/base-report.md", "../_shared/owasp-cheatsheets.yaml"]

[security_constraints]
treat_target_content_as_untrusted = true
redact_sensitive_values = "required for secret-like evidence"
skip_binary_and_lock_files = true
network_access = "not required"
output_requires_evidence = true

[[rules]]
id = "SSRF-001"
name = "User input flows directly into HTTP request sink"
severity = "Critical"
category = "SSRF Sink"
description = "A value derived from user-supplied input (request parameter, body field, header, or query string) is passed without validation to an HTTP client call such as requests.get(), fetch(), axios(), HttpClient, urllib, curl, or equivalent. This allows an attacker to direct the server to make requests to arbitrary destinations, including internal services and cloud metadata endpoints.\n"
patterns = ["request\\.(?:args|form|json|data|params|GET|POST)\\b", "req\\.(?:query|body|params)\\b", "ctx\\.(?:query|request\\.body)\\b", "getParam\\(|getQueryParam\\(|getBodyParam\\(", "requests\\.(?:get|post|put|patch|delete|head|request)\\s*\\(", "urllib\\.request\\.urlopen\\s*\\(", "urllib2\\.urlopen\\s*\\(", "http\\.(?:get|post|request)\\s*\\(", "axios\\.(?:get|post|put|patch|delete|request)\\s*\\(", "fetch\\s*\\(", "HttpClient\\b.*\\.(?:get|post|send)\\s*\\(", "RestTemplate\\b.*\\.(?:getForObject|postForObject|exchange)\\s*\\(", "WebClient\\b.*\\.(?:get|post|put|delete)\\s*\\(", "curl_exec\\s*\\(", "file_get_contents\\s*\\(.*http"]
match_strategy = "resource_context"
remediation = "Validate and allowlist URLs before making outbound requests. Maintain a static allowlist of permitted schemes (https only), hostnames, and ports. Reject any URL that does not match the allowlist. Use a dedicated HTTP client wrapper that enforces allowlist checks, blocks private IP ranges (RFC1918, loopback, link-local), and strips credentials. Never interpolate raw user input into a URL string.\n"

[[rules]]
id = "SSRF-002"
name = "Access to cloud metadata endpoint"
severity = "Critical"
category = "Cloud Metadata"
description = "A hardcoded reference to a cloud instance metadata service address was found. Strings such as 169.254.169.254 (AWS/Azure/GCP link-local), metadata.google.internal, 100.100.100.200 (Alibaba), or fd00:ec2::254 (AWS IPv6) are indicators of metadata endpoint access, which an SSRF vulnerability could allow an attacker to exploit to retrieve credentials, tokens, or instance configuration.\n"
patterns = ["169\\.254\\.169\\.254", "metadata\\.google\\.internal", "169\\.254\\.170\\.2", "100\\.100\\.100\\.200", "fd00:ec2::254", "instance-data\\.ec2\\.internal", "metadata\\.azure\\.internal", "169\\.254\\.169\\.123"]
match_strategy = "regex"
remediation = "Remove hardcoded references to cloud metadata endpoints from application code. If the application legitimately needs instance metadata, use a dedicated secrets manager (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault) rather than calling the metadata endpoint directly. Enforce IMDSv2 (token-based) on AWS instances and block access to 169.254.169.254 via VPC security groups or host-based firewalls for services that do not need it.\n"

[[rules]]
id = "SSRF-003"
name = "Loopback or private IP address in user-controlled URL"
severity = "High"
category = "Internal Network Probe"
description = "A URL or hostname drawn from user input includes or could resolve to a loopback address (127.0.0.1, localhost, ::1) or RFC1918 private range (10.x, 172.16\u201331.x, 192.168.x). If the application does not validate the resolved IP before making the request, an attacker can use this to probe internal services that are not exposed externally.\n"
patterns = ["localhost", "127\\.0\\.0\\.1", "::1", "0\\.0\\.0\\.0", "10\\.\\d+\\.\\d+\\.\\d+", "172\\.(1[6-9]|2\\d|3[01])\\.\\d+\\.\\d+", "192\\.168\\.\\d+\\.\\d+", "request\\.(?:args|form|json|data|params|GET|POST)\\b", "req\\.(?:query|body|params)\\b"]
match_strategy = "resource_context"
remediation = "After parsing a user-supplied URL, resolve the hostname to its IP address and compare it against a blocklist of disallowed ranges: loopback (127.0.0.0/8, ::1), link-local (169.254.0.0/16), private (10/8, 172.16/12, 192.168/16), and multicast (224.0.0.0/4). Reject requests whose resolved IP falls within any blocked range. Perform the check after resolution to prevent DNS rebinding attacks.\n"

[[rules]]
id = "SSRF-004"
name = "User input concatenated into URL string"
severity = "High"
category = "URL Construction"
description = "User-supplied input is concatenated directly into a URL string that is later used in an outbound request. String concatenation bypasses structured URL parsers and allowlist checks and allows path traversal, scheme injection (file://, gopher://, dict://), or credential injection into the URL.\n"
patterns = ["url\\s*=\\s*[\"'].+[\"']\\s*\\+\\s*(?:request|req|params|query|body|input|user)", "url\\s*=\\s*(?:request|req|params|query|body|input|user).*\\+.*[\"']", "f[\"']https?://.*\\{.*(?:request|req|param|query|body|input|user)", "\"https?://\"\\s*\\+\\s*(?:request|req|param|query|body|input|user)", "String\\.format\\(.*https?://.*%s.*,.*(?:request|req|param|input)", "\\$\\{.*(?:url|host|endpoint|target|destination).*\\}"]
match_strategy = "resource_context"
remediation = "Use a URL-building library (urllib.parse.urljoin, URL() constructor, java.net.URI) to assemble outbound URLs. Never concatenate user input directly into a URL string. Extract and validate each URL component (scheme, host, port, path) separately before reassembly. Allowlist permitted schemes and hostnames. Encode path segments using the library's percent-encoding APIs.\n"

[[rules]]
id = "SSRF-005"
name = "File or non-HTTP URI scheme accepted from user input"
severity = "High"
category = "Dangerous Scheme"
description = "A non-HTTP URI scheme such as file://, gopher://, dict://, ftp://, sftp://, or ldap:// appears in a URL that may originate from user input. These schemes can be used to read local files (file://), access internal services via the Gopher protocol (gopher://), or probe LDAP directories (ldap://).\n"
patterns = ["file://", "gopher://", "dict://", "ftp://", "sftp://", "ldap://", "ldaps://", "netdoc://", "jar://", "\\bscheme\\s*==?\\s*[\"'](?:file|gopher|dict|ftp|ldap)"]
match_strategy = "regex"
remediation = "Enforce an allowlist of permitted URI schemes before making any outbound request. Reject all schemes except https (and http if required by legacy systems with documented justification). Use urllib.parse.urlparse().scheme, new URL().protocol, or URI.getScheme() to extract the scheme before passing the URL to any HTTP client.\n"

[[rules]]
id = "SSRF-006"
name = "Redirect to user-supplied URL"
severity = "High"
category = "Open Redirect"
description = "The application constructs an HTTP redirect response (301, 302, 307, 308) using a URL sourced from user input without validation. If the HTTP client follows redirects automatically, this can be combined with an SSRF sink to bypass initial allowlist checks \u2014 the first request goes to a permitted host, which then redirects to an internal target.\n"
patterns = ["redirect\\s*\\(.*(?:request|req|params|query|body|input|user)", "response\\.redirect\\s*\\(.*(?:request|req|params|query|body|input)", "res\\.redirect\\s*\\(.*(?:req\\.query|req\\.body|req\\.params)", "HttpResponseRedirect\\s*\\(.*(?:request\\.GET|request\\.POST)", "return\\s+redirect\\s*\\(.*(?:request\\.args|request\\.form)", "Location:\\s*\\$\\{.*(?:url|redirect|return|next|target)", "allow_redirects\\s*=\\s*True", "followRedirects\\s*:\\s*true", "maxRedirects\\s*:\\s*[1-9]"]
match_strategy = "resource_context"
remediation = "Disable automatic redirect following in HTTP clients used to fetch user-supplied URLs (allow_redirects=False in requests, followRedirects: false in axios, etc.). If redirect following is required, re-validate the destination URL against the allowlist at each hop. For application-level redirects, validate the URL against an allowlist of safe hosts before issuing the Location header. Use a relative path or opaque token instead of a full URL wherever possible.\n"

[[rules]]
id = "SSRF-007"
name = "DNS resolution of user-supplied hostname"
severity = "Medium"
category = "DNS Lookup"
description = "The application resolves a hostname sourced from user input via a DNS lookup. Even if the resolved IP is later validated, DNS rebinding attacks can cause the validation-time address to differ from the connect-time address. Lookup results should be cached and the same resolved address used for both validation and the subsequent connection.\n"
patterns = ["socket\\.gethostbyname\\s*\\(", "socket\\.getaddrinfo\\s*\\(", "InetAddress\\.getByName\\s*\\(", "Dns\\.GetHostEntry\\s*\\(", "dns\\.lookup\\s*\\(", "dns\\.resolve\\s*\\(", "nslookup\\b", "request\\.(?:args|form|json|data|params|GET|POST)\\b", "req\\.(?:query|body|params)\\b"]
match_strategy = "resource_context"
remediation = "Resolve the hostname once and reuse the same IP address for both validation and connection. Do not pass the hostname to the HTTP client after validation \u2014 pass the resolved IP and set the Host header explicitly to prevent the client from re-resolving. Consider using a dedicated egress proxy that enforces network-level controls (e.g., Squid with ACLs, a service mesh egress policy) rather than application-level IP validation.\n"

[[rules]]
id = "SSRF-008"
name = "Webhook URL accepted from user input without validation"
severity = "Medium"
category = "Webhook"
description = "The application accepts a webhook URL from user input (API request, configuration form, or database record) and later makes an outbound HTTP request to that URL. Webhook endpoints are a common SSRF vector because the URL is stored and called asynchronously, making validation errors harder to detect and trace.\n"
patterns = ["webhook_url\\b", "webhookUrl\\b", "callback_url\\b", "callbackUrl\\b", "notify_url\\b", "notifyUrl\\b", "endpoint_url\\b", "endpointUrl\\b", "requests\\.(?:get|post|put|patch|delete|head|request)\\s*\\(", "axios\\.(?:get|post|put|patch|delete|request)\\s*\\(", "fetch\\s*\\(", "http\\.(?:get|post|request)\\s*\\("]
match_strategy = "resource_context"
remediation = "Validate webhook URLs at submission time against a scheme+host allowlist. Reject URLs that resolve to private, loopback, or link-local addresses. Re-validate at delivery time in case the DNS mapping has changed. Rate-limit and authenticate webhook deliveries to prevent abuse. Log all outbound webhook requests including the destination URL, response code, and latency for incident response purposes.\n"
