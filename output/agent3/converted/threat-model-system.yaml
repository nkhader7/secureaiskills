name: threat-model-system
description: Builds a lightweight system threat model from product, architecture,
  API, data-flow, and infrastructure context. Use during design review or when a feature
  changes trust boundaries, authentication, authorization, sensitive data handling,
  external integrations, or deployment architecture.
version: '1.0'
intent: '# threat-model-system'
instructions: "# threat-model-system\n\nCreates a structured threat model for the\
  \ code and design artifacts in the current workspace.\n\n## Orchestration\n\n1.\
  \ Load `references/rules.yaml` to get the active threat-modeling criteria.\n2. Load\
  \ `../_shared/owasp-cheatsheets.yaml` and use the mapped OWASP cheat sheets to support\
  \ remediation guidance and references.\n3. Gather available system context from\
  \ user input and repository artifacts:\n   - Design docs, README files, ADRs, API\
  \ specs, diagrams, data schemas, IaC, service configs, auth code, routing code,\
  \ and deployment notes.\n   - Prefer changed files on the current branch when reviewing\
  \ a pull request or feature branch.\n   - Scan a user-provided path when one is\
  \ supplied.\n4. Identify core model elements:\n   - Assets and sensitive data.\n\
  \   - Actors and identities.\n   - Entry points and exposed interfaces.\n   - Trust\
  \ boundaries.\n   - Data flows and storage locations.\n   - External dependencies\
  \ and third-party integrations.\n   - Privileged operations and administrative paths.\n\
  5. Evaluate the system against every rule in `references/rules.yaml`.\n   - For\
  \ `match_strategy: design_review`, use the rule as a review question and evidence\
  \ checklist.\n   - Report a finding when required controls are missing, ambiguous,\
  \ unverifiable, or contradicted by available evidence.\n   - Mark unknowns as findings\
  \ when the missing information blocks a security decision.\n6. For each finding,\
  \ capture the affected component, rule ID, threat scenario, evidence, impact, likelihood,\
  \ and recommended mitigation.\n7. Aggregate findings by severity: Critical, High,\
  \ Medium, Low, Info.\n8. Render the final threat model using `references/report-template.md`.\n\
  \n## Usage\n\nThreat model a feature or design from the current context:\n\n```text\n\
  /threat-model-system\n```\n\nThreat model a specific directory or document:\n\n\
  ```text\n/threat-model-system docs/checkout-design.md\n```\n\nThreat model changed\
  \ architecture and code on the current branch:\n\n```text\n/threat-model-system\
  \ --changed\n```\n\n## Review Guidance\n\nPrioritize threats that cross trust boundaries,\
  \ expose sensitive data, weaken authentication or authorization, introduce unsafe\
  \ defaults, or rely on unclear ownership. Treat missing design evidence as a real\
  \ risk when it prevents validation of critical controls.\n\n## OWASP Cheat Sheets\n\
  \nUse the shared mapping in `../_shared/owasp-cheatsheets.yaml` for authoritative\
  \ OWASP Cheat Sheet Series references that match this skill. Include the relevant\
  \ cheat sheet links in the report when they directly support a finding or remediation."
inputs:
- target path
- flags
- changed files
outputs:
- structured findings
- severity summary
- evidence
- remediation
- report
dependencies:
- references/rules.yaml
- references/report-template.md
- ../_shared/base-report.md
- ../_shared/owasp-cheatsheets.yaml
security_constraints:
  treat_target_content_as_untrusted: true
  redact_sensitive_values: required for secret-like evidence
  skip_binary_and_lock_files: true
  network_access: not required
  output_requires_evidence: true
references:
  rules: references/rules.yaml
  report_template: references/report-template.md
  base_report: ../_shared/base-report.md
  owasp_cheatsheets: ../_shared/owasp-cheatsheets.yaml
rules:
- id: TMS-001
  severity: High
  category: Scope
  name: Missing System Boundary
  description: The reviewed design does not clearly define what components, users,
    environments, or responsibilities are in scope.
  match_strategy: design_review
  review_questions:
  - What components and environments are part of this system?
  - Which components are explicitly out of scope?
  - Who owns each security-sensitive boundary?
  evidence:
  - Architecture diagram
  - README or design document
  - Service ownership metadata
  finding_when:
  - System boundary is not documented.
  - Ownership is unclear for security-sensitive components.
  - External dependencies are treated as internal without justification.
  remediation: Define the system boundary, ownership, deployment environments, and
    out-of-scope dependencies before approving the design.
- id: TMS-002
  severity: High
  category: Trust Boundary
  name: Unclear Trust Boundary
  description: Data or requests cross between users, services, networks, tenants,
    or execution contexts without a documented trust boundary.
  match_strategy: design_review
  review_questions:
  - Where does untrusted input enter the system?
  - Which network, tenant, service, or privilege boundaries are crossed?
  - What validation, authentication, authorization, or isolation control exists at
    each boundary?
  evidence:
  - Data-flow diagram
  - API specification
  - Network or deployment diagram
  - Authorization design
  finding_when:
  - A trust boundary is implied but not documented.
  - A boundary has no explicit control.
  - The design relies on caller honesty or network location alone.
  remediation: Document each trust boundary and require explicit controls such as
    authentication, authorization, validation, isolation, and monitoring at the crossing.
- id: TMS-003
  severity: Critical
  category: Authentication
  name: Weak Or Missing Authentication
  description: A user, service, job, webhook, or administrative path can access protected
    behavior without strong authentication.
  match_strategy: design_review
  review_questions:
  - Which actors authenticate to each entry point?
  - Are service-to-service calls authenticated?
  - How are webhooks, background jobs, and admin paths authenticated?
  - Are credentials rotated and protected?
  evidence:
  - Auth flow
  - API gateway configuration
  - IAM policy
  - Webhook verification design
  - Session or token design
  finding_when:
  - Protected entry points have no authentication requirement.
  - Shared secrets, static tokens, or network-only trust are the primary control.
  - Webhook signatures or service identities are not verified.
  remediation: Require strong authentication for users, services, automation, and
    webhooks. Prefer managed identity, short-lived tokens, signed requests, MFA for
    admin access, and credential rotation.
- id: TMS-004
  severity: Critical
  category: Authorization
  name: Missing Object Or Action Authorization
  description: The design does not prove that users or services are authorized for
    each requested object, tenant, action, or privileged operation.
  match_strategy: design_review
  review_questions:
  - What authorization decision is made for each sensitive action?
  - Are object-level and tenant-level checks enforced server-side?
  - Are admin or support workflows separated from normal user flows?
  - How are service permissions minimized?
  evidence:
  - Authorization matrix
  - Role or permission model
  - API handler design
  - IAM policy
  - Tenant isolation design
  finding_when:
  - Object ownership checks are not described.
  - Tenant ID, account ID, or object ID is accepted from the caller without server-side
    validation.
  - Privileged actions are protected only by UI controls.
  - Service identities have broad or wildcard permissions.
  remediation: Define server-side authorization for every sensitive object and action.
    Enforce least privilege, tenant isolation, deny-by-default behavior, and separate
    privileged workflows.
- id: TMS-005
  severity: High
  category: Data Protection
  name: Sensitive Data Flow Not Classified
  description: Sensitive data is collected, transmitted, processed, stored, or shared
    without classification and handling requirements.
  match_strategy: design_review
  review_questions:
  - What sensitive data does the system handle?
  - Where is sensitive data stored and transmitted?
  - What retention, deletion, masking, and access requirements apply?
  - Is sensitive data sent to logs, analytics, AI models, or third parties?
  evidence:
  - Data inventory
  - Data-flow diagram
  - Database schema
  - Logging design
  - Privacy or compliance notes
  finding_when:
  - Sensitive data types are not identified.
  - Retention or deletion behavior is undefined.
  - Logs, analytics, AI prompts, or third-party processors may receive sensitive data
    without controls.
  remediation: Classify sensitive data and define encryption, access control, retention,
    deletion, masking, logging, and third-party handling requirements.
- id: TMS-006
  severity: High
  category: Input Handling
  name: Untrusted Input Without Validation
  description: User, service, file, webhook, message queue, AI output, or third-party
    input reaches business logic without explicit validation or parsing rules.
  match_strategy: design_review
  review_questions:
  - What inputs are untrusted?
  - Are schemas, size limits, type checks, and allowlists defined?
  - Are uploaded files, URLs, serialized objects, and AI-generated actions constrained?
  - Where is canonicalization performed?
  evidence:
  - API schema
  - Input validation design
  - File upload design
  - Message schema
  - Prompt or tool-use guardrail design
  finding_when:
  - Input schemas are missing or permissive.
  - File, URL, command, path, SQL, NoSQL, XML, template, or deserialization inputs
    are not constrained.
  - AI output can trigger actions without validation or policy checks.
  remediation: Define strict schemas, size limits, allowlists, canonicalization, safe
    parsers, and output-to-action validation for every untrusted input path.
- id: TMS-007
  severity: High
  category: Secrets
  name: Secret Lifecycle Not Defined
  description: API keys, tokens, certificates, signing keys, encryption keys, or service
    credentials are used without a lifecycle plan.
  match_strategy: design_review
  review_questions:
  - What secrets does the system require?
  - Where are secrets generated, stored, rotated, and revoked?
  - Who or what can access each secret?
  - Are secrets exposed to clients, logs, builds, or third parties?
  evidence:
  - Secret inventory
  - Key management design
  - CI/CD configuration
  - Runtime configuration
  - IAM policy
  finding_when:
  - Secrets are stored in code, images, client-side applications, or shared config.
  - Rotation and revocation are undefined.
  - Long-lived credentials are used where short-lived identity is available.
  remediation: Store secrets in a managed secrets service, restrict access, rotate
    regularly, prefer short-lived credentials or managed identity, and prevent exposure
    in logs, builds, and client code.
- id: TMS-008
  severity: Medium
  category: Abuse Case
  name: Abuse Cases Not Considered
  description: The design describes intended use but does not consider misuse, fraud,
    denial of service, escalation, automation, or business-logic abuse.
  match_strategy: design_review
  review_questions:
  - How could a user profit from misusing this feature?
  - What happens if requests are replayed, automated, reordered, or raced?
  - What quotas, rate limits, and abuse detection controls exist?
  - Can users bypass payment, approval, consent, or workflow state?
  evidence:
  - Product requirements
  - Sequence diagram
  - Rate limit design
  - State machine
  - Fraud or abuse controls
  finding_when:
  - No abuse cases are documented for user-facing or externally exposed workflows.
  - Workflow state can be skipped or replayed.
  - Rate limits, quotas, or abuse monitoring are missing for high-impact operations.
  remediation: Add abuse cases, enforce state transitions server-side, apply rate
    limits and quotas, detect automation and replay, and monitor suspicious behavior.
- id: TMS-009
  severity: Medium
  category: Availability
  name: Resilience And Failure Mode Gaps
  description: The system lacks clear handling for dependency failures, retries, timeouts,
    backpressure, degraded mode, or data recovery.
  match_strategy: design_review
  review_questions:
  - What happens when each dependency fails or slows down?
  - Are timeouts, retries, circuit breakers, and idempotency defined?
  - Can failures cause duplicate actions, data corruption, or privilege changes?
  - What recovery and backup controls exist?
  evidence:
  - Dependency map
  - Queue or job design
  - Retry policy
  - Backup and recovery plan
  - Incident runbook
  finding_when:
  - Critical dependencies have no failure behavior.
  - Retries are not bounded or idempotent.
  - Backup, restore, or recovery point objectives are undefined for important data.
  remediation: Define failure behavior, bounded retries, idempotency keys, timeouts,
    circuit breakers, backpressure, backup and restore controls, and operational runbooks.
- id: TMS-010
  severity: Medium
  category: Observability
  name: Security Logging And Detection Missing
  description: The design does not specify audit events, security logs, alerts, or
    investigation evidence for sensitive actions.
  match_strategy: design_review
  review_questions:
  - Which security events are logged?
  - Are authentication, authorization, admin, data export, and configuration changes
    auditable?
  - Are logs protected from tampering and sensitive data leakage?
  - What alerts indicate compromise or abuse?
  evidence:
  - Logging design
  - Audit event schema
  - Monitoring configuration
  - Incident response notes
  finding_when:
  - Sensitive actions are not auditable.
  - Logs may contain secrets or sensitive data.
  - Alerts are missing for high-impact abuse or compromise signals.
  remediation: Define security-relevant audit events, protect logs, avoid sensitive
    log content, establish alerts, and ensure investigation evidence is retained.
- id: TMS-011
  severity: Medium
  category: Supply Chain
  name: External Dependency Risk Unreviewed
  description: Third-party services, libraries, packages, models, APIs, plugins, or
    vendors are introduced without security review.
  match_strategy: design_review
  review_questions:
  - What external dependencies does the system rely on?
  - What data or privileges does each dependency receive?
  - How are dependency updates, compromise, outages, and contract changes handled?
  - Are model, plugin, or API providers allowed to retain or train on sensitive data?
  evidence:
  - Dependency manifest
  - Vendor review
  - Data processing agreement
  - Integration design
  - Model or plugin policy
  finding_when:
  - New external dependencies have no review evidence.
  - Third parties receive sensitive data without contractual or technical controls.
  - Dependency compromise or outage impact is not assessed.
  remediation: Review external dependencies for data access, privileges, operational
    risk, update process, retention terms, and fallback behavior before use.
- id: TMS-012
  severity: Low
  category: Decision Tracking
  name: Security Assumptions Not Tracked
  description: Important security assumptions, accepted risks, and follow-up actions
    are not recorded with owners and due dates.
  match_strategy: design_review
  review_questions:
  - What assumptions did this threat model rely on?
  - Which risks are accepted, deferred, or blocked?
  - Who owns each mitigation?
  - When should the threat model be revisited?
  evidence:
  - Risk register
  - Issue tracker
  - ADR
  - Threat model report
  finding_when:
  - Assumptions are implicit.
  - Follow-up actions have no owner or due date.
  - Accepted risks have no expiration or compensating controls.
  remediation: Record assumptions, unknowns, accepted risks, owners, due dates, and
    revisit triggers in the threat model or issue tracker.
default_match_strategy: unspecified
