  {{/if}}


  ## Summary Table


  | Severity | Count |

  |----------|-------|

  | Critical | {{count_critical}} |

  | High     | {{count_high}} |

  | Medium   | {{count_medium}} |

  | Low      | {{count_low}} |

  | Info     | {{count_info}} |


  ## Assumptions And Unknowns


  {{assumptions}}


  {{unknowns}}


  ## Review Focus


  - Address all **Critical** and **High** findings before implementation or release.

  - Resolve unknowns that block security decisions for authentication, authorization,
  data protection, or external exposure.

  - Document accepted risks with an owner, expiration date, and compensating controls.

  - Re-run the threat model when trust boundaries, privileged flows, or sensitive
  data handling changes.

