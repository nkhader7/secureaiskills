name: detect-secrets
description: Detects hardcoded secrets, credentials, and sensitive tokens committed
  to source code
version: '1.0'
intent: '# detect-secrets'
instructions: "# detect-secrets\n\nDetects hardcoded secrets, API keys, private keys,\
  \ tokens, and credentials that should never appear in source code.\n\n## Orchestration\n\
  \n1. Load `references/rules.yaml` to get the active rule set and its `default_match_strategy`.\n\
  2. Load `../_shared/owasp-cheatsheets.yaml` and use the mapped OWASP cheat sheets\
  \ to support remediation guidance and references.\n3. Identify files to scan \u2014\
  \ default to changed files on the current branch (`git diff main...HEAD --name-only`);\
  \ scan all tracked files when a path argument is provided.\n4. Skip binary files,\
  \ lock files (`package-lock.json`, `*.lock`), and files listed in `.gitignore`.\n\
  5. Select rules before scanning when the target is large:\n   - Always include custom\
  \ `DS-` rules.\n   - Include provider-specific rules when filenames, imports, environment\
  \ variable names, or nearby text indicate that provider or technology.\n   - For\
  \ broad `--all` scans, run high-confidence credential formats first, then expand\
  \ to lower-confidence rules if findings or target context justify it.\n6. For each\
  \ file, evaluate every line against each rule's `patterns` using `default_match_strategy:\
  \ regex` unless a rule overrides it.\n7. For each match, capture the file path,\
  \ line number, rule ID, and a masked snippet (replace the matched secret value with\
  \ `***REDACTED***`).\n8. Aggregate findings by severity (Critical \u2192 High \u2192\
  \ Medium \u2192 Low \u2192 Info).\n9. Render the final report using `references/report-template.md`.\n\
  \n## Usage\n\nScan changed files on the current branch:\n\n```text\n/detect-secrets\n\
  ```\n\nScan a specific path or directory:\n\n```text\n/detect-secrets src/config/\n\
  ```\n\nScan all tracked files in the repository:\n\n```text\n/detect-secrets --all\n\
  ```\n\n## OWASP Cheat Sheets\n\nUse the shared mapping in `../_shared/owasp-cheatsheets.yaml`\
  \ for authoritative OWASP Cheat Sheet Series references that match this skill. Include\
  \ the relevant cheat sheet links in the report when they directly support a finding\
  \ or remediation."
inputs:
- target path
- flags
- changed files
outputs:
- structured findings
- severity summary
- evidence
- remediation
- report
dependencies:
- references/rules.yaml
- references/report-template.md
- ../_shared/base-report.md
- ../_shared/owasp-cheatsheets.yaml
security_constraints:
  treat_target_content_as_untrusted: true
  redact_sensitive_values: required for secret-like evidence
  skip_binary_and_lock_files: true
  network_access: not required
  output_requires_evidence: true
references:
  rules: references/rules.yaml
  report_template: references/report-template.md
  base_report: ../_shared/base-report.md
  owasp_cheatsheets: ../_shared/owasp-cheatsheets.yaml
rules:
- id: DS-001
  severity: Critical
  category: Cloud Credentials
  name: AWS Access Key
  description: AWS Access Key ID followed by a Secret Access Key in the same file
  patterns:
  - AKIA[0-9A-Z]{16}
  - ASIA[0-9A-Z]{16}
  - aws_access_key_id\s*=\s*['"]?AKIA[0-9A-Z]{16}
  - aws_secret_access_key\s*=\s*['"]?[A-Za-z0-9/+=]{40}
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Revoke the key immediately in AWS IAM. Rotate and store in AWS Secrets
    Manager or environment variables.
- id: DS-002
  severity: Critical
  category: Cloud Credentials
  name: GCP Service Account Key
  description: Google Cloud service account private key embedded in source
  patterns:
  - '"type":\s*"service_account"'
  - '"private_key":\s*"-----BEGIN'
  - GOOGLE_APPLICATION_CREDENTIALS.*\.json
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Delete the service account key in GCP IAM. Use Workload Identity Federation
    or Secret Manager instead.
- id: DS-003
  severity: Critical
  category: Cloud Credentials
  name: Azure Client Secret
  description: Azure client secret or storage account key in source
  patterns:
  - AZURE_CLIENT_SECRET\s*=\s*['"][^'"]{20,}
  - DefaultEndpointsProtocol=https;AccountName=.*AccountKey=[A-Za-z0-9+/=]{80,}
  - client_secret\s*=\s*['"][A-Za-z0-9~._\-]{30,}
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Rotate the secret in Azure AD / Azure Portal. Use Azure Key Vault or
    managed identities.
- id: DS-004
  severity: Critical
  category: Private Keys
  name: Private Key Material
  description: PEM-encoded private key block (RSA, EC, DSA, OpenSSH)
  patterns:
  - '-----BEGIN RSA PRIVATE KEY-----'
  - '-----BEGIN EC PRIVATE KEY-----'
  - '-----BEGIN DSA PRIVATE KEY-----'
  - '-----BEGIN OPENSSH PRIVATE KEY-----'
  - '-----BEGIN PRIVATE KEY-----'
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: "Revoke and regenerate the key pair. Never commit private keys \xE2\
    \u20AC\u201D use a secrets manager or hardware token."
- id: DS-005
  severity: Critical
  category: Payment
  name: Stripe Secret Key
  description: Stripe live or test secret API key
  patterns:
  - sk_live_[A-Za-z0-9]{24,}
  - sk_test_[A-Za-z0-9]{24,}
  - rk_live_[A-Za-z0-9]{24,}
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Roll the key immediately in the Stripe Dashboard. Use environment variables;
    never commit payment credentials.
- id: DS-006
  severity: High
  category: Version Control
  name: GitHub Personal Access Token
  description: GitHub classic or fine-grained personal access token
  patterns:
  - ghp_[A-Za-z0-9]{36}
  - github_pat_[A-Za-z0-9_]{82}
  - gho_[A-Za-z0-9]{36}
  - ghs_[A-Za-z0-9]{36}
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Revoke the token at github.com/settings/tokens. Rotate and store in
    a secrets manager or CI secrets store.
- id: DS-007
  severity: High
  category: Communication
  name: Slack Token
  description: Slack bot, app, or legacy token in source
  patterns:
  - xoxb-[0-9A-Za-z\-]{50,}
  - xoxp-[0-9A-Za-z\-]{50,}
  - xoxa-[0-9A-Za-z\-]{50,}
  - xoxs-[0-9A-Za-z\-]{50,}
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Revoke the token in the Slack app management console. Use environment
    variables or a secrets manager.
- id: DS-008
  severity: High
  category: Cloud Credentials
  name: Generic API Key Assignment
  description: Variable named after a key or token assigned a high-entropy string
    literal
  patterns:
  - (api_key|apikey|api_token|access_token|auth_token)\s*=\s*['"][A-Za-z0-9_\-]{20,}['"]
  - (API_KEY|API_TOKEN|ACCESS_TOKEN|AUTH_TOKEN)\s*=\s*['"][A-Za-z0-9_\-]{20,}['"]
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Move the value to an environment variable or secrets manager and reference
    it at runtime.
- id: DS-009
  severity: High
  category: Authentication
  name: Database Connection String with Password
  description: Database DSN or connection string containing an inline password
  patterns:
  - (mysql|postgresql|postgres|mongodb|mssql|redis)://[^:]+:[^@]{4,}@
  - password=[^;\s&]{4,}
  - Password=[^;\s&]{4,}
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Externalize the connection string to environment variables or a secrets
    manager. Use IAM authentication where supported.
- id: DS-010
  severity: High
  category: Authentication
  name: Bearer Token in Code
  description: Hard-coded Bearer token string
  patterns:
  - Bearer [A-Za-z0-9\-._~+/]{20,}
  - authorization.*Bearer [A-Za-z0-9\-._~+/]{20,}
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Obtain tokens at runtime via an auth flow. Never hard-code bearer tokens.
- id: DS-011
  severity: Medium
  category: Authentication
  name: Generic Password Assignment
  description: Variable named password assigned a non-empty string literal
  patterns:
  - (password|passwd|pwd)\s*=\s*['"][^'"]{4,}['"]
  - (PASSWORD|PASSWD|PWD)\s*=\s*['"][^'"]{4,}['"]
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Use environment variables or a secrets manager. If this is a test fixture,
    ensure it cannot reach production.
- id: DS-012
  severity: Medium
  category: Configuration
  name: Committed .env File
  description: A .env file containing key=value pairs has been committed
  patterns:
  - ^\.env$
  - ^\.env\.(local|production|staging|development)$
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Add .env files to .gitignore. Use .env.example with placeholder values
    for documentation.
- id: DS-013
  severity: Low
  category: Authentication
  name: Potential JWT
  description: String matching JWT structure (three base64url segments separated by
    dots)
  patterns:
  - eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}
  source:
    project: nkhader7/secureaiskills
    path: skills/detect-secrets/references/rules.yaml
    url: https://github.com/nkhader7/secureaiskills/blob/main/skills/detect-secrets/references/rules.yaml
  remediation: Verify whether this is a live token. If so, invalidate it and remove
    from source. JWTs belong in runtime config, not code.
- id: GITLEAKS-1PASSWORD-SECRET-KEY
  severity: Medium
  category: API Key
  name: 1password Secret Key
  description: Uncovered a possible 1Password secret key, potentially compromising
    access to secrets in vaults.
  patterns:
  - \bA3-[A-Z0-9]{6}-(?:(?:[A-Z0-9]{11})|(?:[A-Z0-9]{6}-[A-Z0-9]{5}))-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}\b
  keywords:
  - a3-
  entropy: 3.8
  path: config/gitleaks.toml
  source:
    project: gitleaks/gitleaks
    path: config/gitleaks.toml
    url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
  remediation: Revoke and rotate this credential immediately. Store secrets in a secrets
    manager, not in source code.
- id: GITLEAKS-1PASSWORD-SERVICE-ACCOUNT-TOKEN
  severity: Medium
  category: API Key
  name: 1password Service Account Token
  description: Uncovered a possible 1Password service account token, potentially compromising
    access to secrets in vaults.
  patterns:
  - ops_eyJ[a-zA-Z0-9+/]{250,}={0,3}
  keywords:
  - ops_
  entropy: 4
  path: config/gitleaks.toml
  source:
    project: gitleaks/gitleaks
    path: config/gitleaks.toml
    url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
  remediation: Revoke and rotate this credential immediately. Store secrets in a secrets
    manager, not in source code.
- id: GITLEAKS-ADAFRUIT-API-KEY
  severity: Medium
  category: API Key
  name: Adafruit Api Key
  description: Identified a potential Adafruit API Key, which could lead to unauthorized
    access to Adafruit services and sensitive data exposure.
  patterns:
  - (?i)[\w.-]{0,50}?(?:adafruit)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9_-]{32})(?:[\x60'"\s;]|\\[nr]|$)
  keywords:
  - adafruit
  path: config/gitleaks.toml
  source:
    project: gitleaks/gitleaks
    path: config/gitleaks.toml
    url: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
  remediation: Revoke and rotate this credential immediately. Store secrets in a secrets
