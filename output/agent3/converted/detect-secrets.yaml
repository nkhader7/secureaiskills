report_template: "# detect-secrets Report\n\n| Field | Value |\n|-------|-------|\n\
  | Skill | detect-secrets |\n| Target | {{target}} |\n| Date | {{date}} |\n| Branch\
  \ | {{branch}} |\n| Files Scanned | {{file_count}} |\n| Secrets Found | {{total_findings}}\
  \ |\n| Overall Severity | {{overall_severity}} |\n\n---\n\n## Findings\n\n{{#each\
  \ findings}}\n### [{{severity}}] {{rule_id}} \u2014 {{rule_name}}\n\n**File:** `{{file}}`\
  \ (line {{line}})\n**Category:** {{category}}\n**Description:** {{description}}\n\
  \n```text\n{{snippet_masked}}\n```\n\n**Remediation:** {{remediation}}\n\n---\n\
  {{/each}}\n\n{{#if no_findings}}\nNo secrets or credentials were detected in the\
  \ scanned files.\n{{/if}}\n\n## Summary Table\n\n| Severity | Count |\n|----------|-------|\n\
  | Critical | {{count_critical}} |\n| High     | {{count_high}} |\n| Medium   | {{count_medium}}\
  \ |\n| Low      | {{count_low}} |\n| Info     | {{count_info}} |\n\n## Immediate\
  \ Actions\n\n- **Rotate every Critical and High secret now** \u2014 assume any committed\
  \ secret is compromised, regardless of whether the branch was merged.\n- Check `git\
  \ log --all -S \"<secret>\"` to confirm whether the secret appears in earlier commits;\
  \ if so, rewrite history with `git filter-repo`.\n- Add detected file types or variable\
  \ names to `.gitignore` and pre-commit hooks (e.g., `detect-secrets`, `trufflehog`)\
  \ to prevent recurrence.\n- **Medium** and **Low** findings should be reviewed and\
  \ remediated before the next release.\n"
