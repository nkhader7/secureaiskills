[[rules]]
id = "GITLEAKS-ASANA-CLIENT-SECRET"
name = "Asana Client Secret"
severity = "Medium"
category = "API Key"
description = "Identified an Asana Client Secret, which could lead to compromised project management integrity and unauthorized access."
patterns = ["(?i)[\\w.-]{0,50}?(?:asana)(?:[ \\t\\w.-]{0,20})[\\s'\"]{0,3}(?:=|>|:{1,3}=|\\|\\||:|=>|\\?=|,)[\\x60'\"\\s=]{0,5}([a-z0-9]{32})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"]
remediation = "Revoke and rotate this credential immediately. Store secrets in a secrets manager, not in source code."

[[rules]]
id = "GITLEAKS-ATLASSIAN-API-TOKEN"
name = "Atlassian Api Token"
severity = "Medium"
category = "DevOps Tools"
description = "Detected an Atlassian API token, posing a threat to project management and collaboration tool security and data confidentiality."
patterns = ["(?i)[\\w.-]{0,50}?(?:(?-i:ATLASSIAN|[Aa]tlassian)|(?-i:CONFLUENCE|[Cc]onfluence)|(?-i:JIRA|[Jj]ira))(?:[ \\t\\w.-]{0,20})[\\s'\"]{0,3}(?:=|>|:{1,3}=|\\|\\||:|=>|\\?=|,)[\\x60'\"\\s=]{0,5}([a-z0-9]{20}[a-f0-9]{4})(?:[\\x60'\"\\s;]|\\\\[nr]|$)|\\b(ATATT3[A-Za-z0-9_\\-=]{186})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"]
remediation = "Revoke and rotate this credential immediately. Store secrets in a secrets manager, not in source code."

[[rules]]
id = "GITLEAKS-AUTHRESS-SERVICE-CLIENT-ACCESS-KEY"
name = "Authress Service Client Access Key"
severity = "Medium"
category = "API Key"
description = "Uncovered a possible Authress Service Client Access Key, which may compromise access control services and sensitive data."
patterns = ["\\b((?:sc|ext|scauth|authress)_(?i)[a-z0-9]{5,30}\\.[a-z0-9]{4,6}\\.(?-i:acc)[_-][a-z0-9-]{10,32}\\.[a-z0-9+/_=-]{30,120})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"]
