[[rules]]
id = "GITLEAKS-ALIBABA-SECRET-KEY"
name = "Alibaba Secret Key"
severity = "Medium"
category = "Cloud Credentials"
description = "Discovered a potential Alibaba Cloud Secret Key, potentially allowing unauthorized operations and data access within Alibaba Cloud."
patterns = ["(?i)[\\w.-]{0,50}?(?:alibaba)(?:[ \\t\\w.-]{0,20})[\\s'\"]{0,3}(?:=|>|:{1,3}=|\\|\\||:|=>|\\?=|,)[\\x60'\"\\s=]{0,5}([a-z0-9]{30})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"]
remediation = "Revoke and rotate this credential immediately. Store secrets in a secrets manager, not in source code."

[[rules]]
