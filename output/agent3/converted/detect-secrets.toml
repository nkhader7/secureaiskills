severity = "Medium"
category = "API Key"
description = "Discovered a potential Asana Client ID, risking unauthorized access to Asana projects and sensitive task information."
patterns = ["(?i)[\\w.-]{0,50}?(?:asana)(?:[ \\t\\w.-]{0,20})[\\s'\"]{0,3}(?:=|>|:{1,3}=|\\|\\||:|=>|\\?=|,)[\\x60'\"\\s=]{0,5}([0-9]{16})(?:[\\x60'\"\\s;]|\\\\[nr]|$)"]
