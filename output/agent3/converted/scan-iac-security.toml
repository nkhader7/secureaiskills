id = "CHECKOV-CKV2-ANSIBLE-3"
name = "Ensure block is handling task errors properly"
severity = "Medium"
category = "Backup and Recovery"
description = "Ensure block is handling task errors properly"
match_strategy = "checkov_graph_check"
remediation = "Update the IaC resource so it satisfies the policy requirement."

