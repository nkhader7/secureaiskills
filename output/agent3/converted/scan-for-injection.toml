name = "scan-for-injection"
description = "Scans source code for injection vulnerabilities mapped to OWASP 2025 Injection coverage, including SQL, command, code, NoSQL, LDAP, XXE/XML, and expression language injection."
version = "1.0"
intent = "# scan-for-injection"
inputs = ["target path", "flags", "changed files"]
outputs = ["structured findings", "severity summary", "evidence", "remediation", "report"]
dependencies = ["references/rules.yaml", "references/report-template.md", "../_shared/base-report.md", "../_shared/owasp-cheatsheets.yaml"]

[security_constraints]
treat_target_content_as_untrusted = true
redact_sensitive_values = "required for secret-like evidence"
skip_binary_and_lock_files = true
network_access = "not required"
output_requires_evidence = true

[[rules]]
id = "SI-001"
name = "SQL Injection"
severity = "Critical"
category = "Injection"
description = "User-controlled input appears to be concatenated or interpolated into SQL statements."
patterns = ["f[\"']\\s*(SELECT|INSERT|UPDATE|DELETE|DROP|ALTER|CREATE).*\\{.*\\}", "(SELECT|INSERT|UPDATE|DELETE|DROP|ALTER|CREATE).*['\"]\\s*\\+\\s*", "(query|execute|raw|exec)\\s*\\([^\\n]*(\\+|format\\(|%\\s*\\(|\\$\\{)", "Statement\\.execute(Query|Update)?\\s*\\([^\\n]*\\+", "createQuery\\s*\\([^\\n]*\\+"]
match_strategy = "regex"
remediation = "Use parameterized queries, prepared statements, or an ORM query builder that separates data from query structure."

[[rules]]
id = "SI-002"
name = "Command Injection"
severity = "Critical"
category = "Injection"
description = "User-controlled input appears to be passed into an operating system command or shell execution sink."
patterns = ["(system|popen|exec|spawn|execFile|shell_exec|passthru|ProcessBuilder|Runtime\\.getRuntime\\(\\)\\.exec)\\s*\\([^\\n]*(\\+|\\$\\{|format\\(|%\\s*\\()", "subprocess\\.(run|call|Popen|check_output)\\s*\\([^\\n]*shell\\s*=\\s*True", "child_process\\.(exec|spawn|execFile)\\s*\\([^\\n]*(req\\.|request\\.|params|query|body)", "os\\.system\\s*\\([^\\n]*(input|request|params|query|body)"]
match_strategy = "regex"
remediation = "Avoid shell execution with user input. Use safe APIs, argument arrays, strict allowlists, and disable shell interpretation."

[[rules]]
id = "SI-003"
name = "Code Injection"
severity = "Critical"
category = "Injection"
description = "User-controlled input appears to be evaluated as code or dynamically compiled."
patterns = ["\\beval\\s*\\([^\\n]*(request|req\\.|params|query|body|input|user)", "\\bexec\\s*\\([^\\n]*(request|req\\.|params|query|body|input|user)", "new Function\\s*\\([^\\n]*(request|req\\.|params|query|body|input|user)", "compile\\s*\\([^\\n]*(request|req\\.|params|query|body|input|user)", "vm\\.runIn(NewContext|ThisContext|Context)\\s*\\("]
match_strategy = "regex"
remediation = "Do not evaluate user-controlled data as code. Replace dynamic evaluation with explicit parsing, allowlisted operations, or safe interpreters."

[[rules]]
id = "SI-004"
name = "NoSQL Injection"
severity = "High"
category = "Injection"
description = "User-controlled input appears to influence NoSQL query operators, filters, or raw query objects."
patterns = ["(find|findOne|updateOne|updateMany|deleteOne|deleteMany)\\s*\\([^\\n]*(req\\.body|req\\.query|request\\.|params)", "\\$where\\s*:", "\\$regex\\s*:\\s*(req\\.|request\\.|params|query|body)", "\\$ne\\s*:\\s*(req\\.|request\\.|params|query|body)", "JSON\\.parse\\s*\\([^\\n]*(req\\.body|req\\.query|request\\.)"]
match_strategy = "regex"
remediation = "Build NoSQL queries from explicit allowlisted fields and operators. Reject operator injection keys such as `$where`, `$ne`, and `$regex` unless explicitly intended."

[[rules]]
id = "SI-005"
name = "LDAP Injection"
severity = "High"
category = "Injection"
description = "User-controlled input appears to be concatenated into LDAP filters or distinguished names."
patterns = ["ldap[^\\n]*(search|filter)[^\\n]*(\\+|format\\(|\\$\\{|%\\s*\\()", "\\(uid=\\s*['\"]?\\s*\\+", "\\(cn=\\s*['\"]?\\s*\\+", "DirContext\\.search\\s*\\([^\\n]*\\+", "LdapQueryBuilder[^\\n]*(where|filter)[^\\n]*(request|req\\.|params|query|body)"]
match_strategy = "regex"
remediation = "Escape LDAP filter metacharacters and construct filters with safe LDAP APIs or strict allowlists."

[[rules]]
id = "SI-006"
name = "XXE / XML Injection"
severity = "High"
category = "Injection"
description = "XML parsing appears to allow external entities, DTDs, or unsafe XML resolver behavior."
patterns = ["DocumentBuilderFactory\\.newInstance\\(\\)", "SAXParserFactory\\.newInstance\\(\\)", "XMLInputFactory\\.newInstance\\(\\)", "resolve_entities\\s*=\\s*True", "load_dtd\\s*=\\s*True", "no_network\\s*=\\s*False", "LIBXML_NOENT", "XmlReaderSettings[^\\n]*DtdProcessing\\s*=\\s*DtdProcessing\\.Parse"]
match_strategy = "regex"
remediation = "Disable DTDs and external entity resolution. Use hardened XML parser settings and reject untrusted XML features."

[[rules]]
id = "SI-007"
name = "Expression / EL Injection"
severity = "High"
category = "Injection"
description = "User-controlled input appears to be evaluated by an expression language, template engine, or dynamic expression parser."
patterns = ["ExpressionParser[^\\n]*parseExpression\\s*\\([^\\n]*(request|req\\.|params|query|body|input)", "SpelExpressionParser[^\\n]*parseExpression\\s*\\(", "createExpression\\s*\\([^\\n]*(request|req\\.|params|query|body|input)", "evaluate\\s*\\([^\\n]*(request|req\\.|params|query|body|input)", "\\$\\{[^\\n}]*(request|req\\.|params|query|body|input)[^\\n}]*\\}", "#\\{[^\\n}]*(request|req\\.|params|query|body|input)[^\\n}]*\\}"]
match_strategy = "regex"
remediation = "Do not evaluate user-controlled strings as expressions or templates. Use static templates, allowlisted variables, and sandboxed expression evaluation when unavoidable."
