  url: "https://github.com/OWASP/CheatSheetSeries/tree/master/cheatsheets"
  purpose: >-
    Shared remediation and review guidance for security skills. Skills should
    use these cheat sheets to support recommendations, not as a replacement for
    local evidence gathered from code, configuration, manifests, SBOMs, and
    runtime context.

