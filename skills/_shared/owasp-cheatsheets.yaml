version: "1.0"

source:
  name: "OWASP Cheat Sheet Series"
  url: "https://github.com/OWASP/CheatSheetSeries/tree/master/cheatsheets"
  purpose: >-
    Shared remediation and review guidance for security skills. Skills should
    use these cheat sheets to support recommendations, not as a replacement for
    local evidence gathered from code, configuration, manifests, SBOMs, and
    runtime context.

skill_mappings:
  audit-asvs-compliance:
    - label: "Application Security Verification Standard alignment"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Secure_Code_Review_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Secure_Product_Design_Cheat_Sheet.md"

  audit-auth-session-management:
    - label: "Authentication and session controls"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Authentication_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Session_Management_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Multifactor_Authentication_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Password_Storage_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/OAuth2_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/SAML_Security_Cheat_Sheet.md"

  audit-crypto-usage:
    - label: "Cryptography, TLS, key management, and password storage"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Cryptographic_Storage_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Key_Management_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/TLS_Cipher_String_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Password_Storage_Cheat_Sheet.md"

  audit-logging-monitoring:
    - label: "Security logging and alerting"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Logging_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Logging_Vocabulary_Cheat_Sheet.md"

  detect-secrets:
    - label: "Secrets handling"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Secrets_Management_Cheat_Sheet.md"

  detect-supply-chain-risks:
    - label: "Software supply chain and CI/CD integrity"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/CI_CD_Security_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/GitHub_Actions_Security_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/NPM_Security_Cheat_Sheet.md"

  generate-dependency-graph:
    - label: "Dependency graph and transitive dependency evidence"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Dependency_Graph_SBOM_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.md"

  generate-sbom:
    - label: "SBOM generation and package inventory"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Dependency_Graph_SBOM_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.md"

  scan-api-security:
    - label: "API and REST assessment"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/REST_Security_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/REST_Assessment_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/GraphQL_Cheat_Sheet.md"

  scan-broken-access-control:
    - label: "Authorization, IDOR, and object access"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Access_Control_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Authorization_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Authorization_Testing_Automation_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Mass_Assignment_Cheat_Sheet.md"

  scan-container-image:
    - label: "Container and Docker hardening"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Docker_Security_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/NodeJS_Docker_Cheat_Sheet.md"

  scan-exception-handling:
    - label: "Error handling and exceptional condition safety"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Error_Handling_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Logging_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Denial_of_Service_Cheat_Sheet.md"

  scan-for-injection:
    - label: "Injection prevention"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Injection_Prevention_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Query_Parameterization_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Input_Validation_Cheat_Sheet.md"

  scan-for-ssrf:
    - label: "Server-side request forgery prevention"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.md"

  scan-for-xss:
    - label: "Cross-site scripting prevention"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Content_Security_Policy_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/HTML5_Security_Cheat_Sheet.md"

  scan-iac-security:
    - label: "Infrastructure as Code and cloud architecture"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Infrastructure_as_Code_Security_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Secure_Cloud_Architecture_Cheat_Sheet.md"

  scan-kubernetes-manifests:
    - label: "Kubernetes hardening"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Kubernetes_Security_Cheat_Sheet.md"

  scan-sca-dependencies:
    - label: "Vulnerable packages and third-party dependency hygiene"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Dependency_Graph_SBOM_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Software_Supply_Chain_Security_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/NPM_Security_Cheat_Sheet.md"

  scan-security-headers:
    - label: "HTTP headers, browser security, CORS, and cookies"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/HTTP_Headers_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/HTTP_Strict_Transport_Security_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Content_Security_Policy_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Clickjacking_Defense_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Cookie_Theft_Mitigation_Cheat_Sheet.md"

  scan-static-analysis:
    - label: "Secure code review"
      urls:
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Secure_Code_Review_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Java_Security_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Nodejs_Security_Cheat_Sheet.md"
        - "https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/DotNet_Security_Cheat_Sheet.md"

  threat-model-system:
    - label: "Design review, abuse cases, and attack surface analysis"
