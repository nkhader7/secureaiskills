owasp_project_curation:
  source:
    name: "OWASP Project Inventory"
    url: "https://owasp.org/projects/"
  purpose: >-
    Curated AppSec project references for the security skills in this
    repository. Use only the rules, standards, test cases, and remediation
    content that directly support application, API, cloud, container, supply
    chain, AI, LLM, agentic, or SDLC security findings. Do not import broad
    awareness, training, game, niche hardware, or unrelated domain content
    unless a target application explicitly falls into that domain.
  include_when:
    - "The project provides AppSec requirements, verification criteria, testing procedures, or secure coding guidance."
    - "The project maps cleanly to an existing skill's evidence model, rule IDs, or remediation language."
    - "The project supports AI, LLM, agentic, MCP, API, supply chain, CI/CD, cloud, container, IaC, Kubernetes, browser, or web application security."
  exclude_by_default:
    - "Training-only, awareness-only, game, card, or intentionally vulnerable application projects."
    - "Highly specialized domains such as drone, maritime, XR, Wi-Fi, OT, blockchain, mobile, IoT, embedded, payment, or desktop unless the reviewed target uses that domain."
    - "Operational tooling that does not add reusable rules, review criteria, test cases, or remediation content for these skills."

