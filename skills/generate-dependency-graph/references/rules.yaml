version: "1.0"

source:
  standard: "Dependency Graph Generation"
  focus: "Direct and transitive dependency graphs, package paths, ownership, reachability, call graph hints, and impact analysis"

rules:
  - id: DG-001
    severity: High
    category: "Direct Dependencies"
    name: "Identify direct dependency roots"
    match_strategy: depgraph_direct
    description: >-
      Identify dependencies declared directly in manifests.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Parse manifests and mark top-level direct dependencies.

  - id: DG-002
    severity: High
    category: "Transitive Dependencies"
    name: "Identify transitive dependency paths"
    match_strategy: depgraph_transitive
    description: >-
      Identify packages introduced through other packages.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Parse lockfiles, SBOM relationships, or package manager graph output.

  - id: DG-003
    severity: Medium
    category: "Shortest Path"
    name: "Report shortest parent path to a package"
    match_strategy: depgraph_shortest_path
    description: >-
      Identify the shortest known chain from root project to target package.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Compute and report direct parent chains for impact analysis.

  - id: DG-004
    severity: Medium
    category: "Multiple Paths"
    name: "Preserve multiple introduction paths"
    match_strategy: depgraph_multiple_paths
    description: >-
      Identify packages introduced by more than one parent.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Group duplicate components and list all relevant parent paths.

  - id: DG-005
    severity: High
    category: "Vulnerable Impact"
    name: "Map vulnerable packages to affected roots"
    match_strategy: depgraph_vuln_impact
    description: >-
      Identify which services/images/manifests depend on vulnerable packages.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Map CVE findings from SCA to dependency graph nodes and roots.

  - id: DG-006
    severity: Medium
    category: "Ownership"
    name: "Attach ownership or service metadata"
    match_strategy: depgraph_ownership
    description: >-
      Identify graph nodes without owning service/team context where available.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Use CODEOWNERS, service catalogs, repo paths, or manifests for ownership hints.

  - id: DG-007
    severity: Medium
    category: "Container Layers"
    name: "Map image packages to layers and base image"
    match_strategy: depgraph_container_layers
    description: >-
      Identify whether image packages come from base image or app layer.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Use SBOM/image metadata to map packages to layers and base image lineage.

  - id: DG-008
    severity: Medium
    category: "Reachability"
    name: "Preserve reachability or call graph signals"
    match_strategy: depgraph_reachability
    description: >-
      Identify callable paths or imported symbols when tooling provides reachability.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Include call graph or import evidence without treating unknown reachability as safe.

  - id: DG-009
    severity: Medium
    category: "Export"
    name: "Export machine-readable graph output"
    match_strategy: depgraph_export
    description: >-
      Identify graph output that cannot be reused by other tools.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Emit JSON plus optional DOT/Mermaid summaries.

  - id: DG-010
    severity: Info
    category: "Graph Freshness"
    name: "Record source files and generation time"
    match_strategy: depgraph_freshness
    description: >-
      Identify graphs missing source evidence or timestamp.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Include source lockfiles/SBOMs, image digests, and generation time.
