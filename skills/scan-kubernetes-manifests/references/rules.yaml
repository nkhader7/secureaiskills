rules:
  - id: CIS-K8S-1-1-1
    recommendation_id: "1.1.1"
    severity: Low
    category: "CIS Kubernetes Benchmark"
    profile: "Level 1 - Master Node"
    section_id: "1.1"
    section_name: "Control Plane Node Configuration Files"
    name: "Ensure that the API server pod specification file permissions are set to 600 or more restrictive"
    assessment_status: "Automated"
    match_strategy: cis_kubernetes_review
    description: >-
      Verify the Kubernetes environment satisfies this benchmark control: Ensure that the API server pod specification file permissions are set to 600 or more restrictive.
    rationale: >-
      This control reduces Kubernetes cluster attack surface, protects sensitive configuration, and supports least-privilege operation for control plane node configuration files.
    impact: >-
      Review operational dependencies before remediation, especially for managed clusters, legacy workloads, offline clusters, and vendor-managed components.
    remediation: >-
      Apply the CIS Kubernetes Benchmark recommendation for 1.1.1; update manifests, component flags, RBAC objects, admission policies, or node configuration as needed.
    audit_procedure: >-
      Review Kubernetes manifests, static pod specifications, kubelet or etcd configuration, RBAC objects, admission policy, and command-output evidence for this control.
    evidence_examples:
      - Kubernetes YAML manifests
      - Helm or Kustomize rendered output
      - Control-plane, etcd, kubelet, or kube-proxy command output
      - kubectl inventory and RBAC review output
    status_values:
      - Pass
      - Fail
      - Partial
      - Unknown
      - Not Applicable

