version: "1.0"

source:
  standard: "Cryptographic Usage Audit"
  focus: "Cryptographic algorithms, key management, TLS, randomness, password hashing, and secret storage"

rules:
  - id: ACU-001
    severity: Critical
    category: "Weak Algorithms"
    name: "Detect MD5, SHA1, RC4, DES, 3DES, ECB, or broken crypto"
    match_strategy: crypto_weak_algorithm
    description: >-
      Identify cryptographic algorithms no longer suitable for security-sensitive use.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Use modern approved primitives such as AES-GCM, ChaCha20-Poly1305, SHA-256+, and Ed25519/ECDSA/RSA-PSS as appropriate.

  - id: ACU-002
    severity: Critical
    category: "TLS Verification"
    name: "Detect disabled certificate verification"
    match_strategy: crypto_tls_verify_disabled
    description: >-
      Identify rejectUnauthorized=false, verify=False, insecureSkipVerify, or equivalent TLS bypasses.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Enable certificate and hostname verification and use trusted CA stores or pinning only when justified.

  - id: ACU-003
    severity: High
    category: "Randomness"
    name: "Detect insecure random generators"
    match_strategy: crypto_insecure_random
    description: >-
      Identify Math.random, rand, or non-cryptographic PRNGs used for tokens, keys, nonces, or passwords.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Use cryptographically secure random APIs.

  - id: ACU-004
    severity: Critical
    category: "Key Exposure"
    name: "Detect hardcoded cryptographic keys"
    match_strategy: crypto_hardcoded_key
    description: >-
      Identify embedded private keys, symmetric keys, salts, or signing secrets.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Move keys to a secret manager or KMS and rotate exposed material.

  - id: ACU-005
    severity: High
    category: "Password Hashing"
    name: "Detect weak password hashing"
    match_strategy: crypto_password_hash
    description: >-
      Identify plaintext, unsalted, fast hashes, or encryption used for passwords.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Use Argon2id, bcrypt, scrypt, or PBKDF2 with strong parameters and salts.

  - id: ACU-006
    severity: High
    category: "Key Management"
    name: "Detect missing key rotation and ownership"
    match_strategy: crypto_key_rotation
    description: >-
      Identify keys without rotation process, owner, expiry, or KMS control.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Define key ownership, rotation, revocation, and audit controls.

  - id: ACU-007
    severity: High
    category: "Encryption at Rest"
    name: "Detect sensitive data stored without encryption"
    match_strategy: crypto_storage
    description: >-
      Identify sensitive data stored in databases, files, queues, or object stores without encryption.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Use envelope encryption, KMS-managed keys, and field-level encryption where needed.

  - id: ACU-008
    severity: Medium
    category: "IV/Nonce"
    name: "Detect static or reused IVs and nonces"
    match_strategy: crypto_nonce_reuse
    description: >-
      Identify constant IVs, predictable nonces, or reuse with stream/AEAD ciphers.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Generate unique unpredictable IVs/nonces according to algorithm requirements.

  - id: ACU-009
    severity: High
    category: "JWT Signing"
    name: "Detect weak JWT signing keys or algorithms"
    match_strategy: crypto_jwt_signing
    description: >-
      Identify none algorithm, HS/RS confusion, weak HMAC secrets, or missing key rotation.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Enforce fixed algorithms, strong keys, key IDs, and rotation.

  - id: ACU-010
    severity: Medium
    category: "Certificate Lifecycle"
    name: "Detect expired or long-lived certificates"
    match_strategy: crypto_cert_lifecycle
    description: >-
      Identify certificates without expiry tracking, renewal process, or appropriate validity windows.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Automate certificate renewal and monitor expiry.

  - id: ACU-011
    severity: Medium
    category: "Custom Crypto"
    name: "Detect homegrown cryptographic protocols"
    match_strategy: crypto_custom
    description: >-
      Identify custom encryption, signing, tokenization, or obfuscation schemes.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Replace with vetted libraries and protocols.

  - id: ACU-012
    severity: Medium
    category: "Secrets in Logs"
    name: "Detect cryptographic material logged"
    match_strategy: crypto_log_exposure
    description: >-
      Identify keys, tokens, signatures, or decrypted sensitive data written to logs.
    evidence_examples:
      - Source code
      - API routes/controllers
      - Tests or security assertions
      - Configuration files
    remediation: >-
      Redact sensitive crypto material and restrict log access.
