version: "1.0"

rules:
  - id: SI-001
    severity: Critical
    category: Injection
    name: SQL Injection
    description: User-controlled input appears to be concatenated or interpolated into SQL statements.
    owasp_2025_category: "A05:2025 - Injection"
    cwe:
      - 89
    capec:
      - 66
    match_strategy: regex
    patterns:
      - "f[\"']\\s*(SELECT|INSERT|UPDATE|DELETE|DROP|ALTER|CREATE).*\\{.*\\}"
      - "(SELECT|INSERT|UPDATE|DELETE|DROP|ALTER|CREATE).*['\"]\\s*\\+\\s*"
      - "(query|execute|raw|exec)\\s*\\([^\\n]*(\\+|format\\(|%\\s*\\(|\\$\\{)"
      - "Statement\\.execute(Query|Update)?\\s*\\([^\\n]*\\+"
      - "createQuery\\s*\\([^\\n]*\\+"
    remediation: Use parameterized queries, prepared statements, or an ORM query builder that separates data from query structure.

  - id: SI-002
    severity: Critical
    category: Injection
    name: Command Injection
    description: User-controlled input appears to be passed into an operating system command or shell execution sink.
    owasp_2025_category: "A05:2025 - Injection"
    cwe:
      - 77
      - 78
    capec:
      - 88
    match_strategy: regex
    patterns:
      - "(system|popen|exec|spawn|execFile|shell_exec|passthru|ProcessBuilder|Runtime\\.getRuntime\\(\\)\\.exec)\\s*\\([^\\n]*(\\+|\\$\\{|format\\(|%\\s*\\()"
      - "subprocess\\.(run|call|Popen|check_output)\\s*\\([^\\n]*shell\\s*=\\s*True"
      - "child_process\\.(exec|spawn|execFile)\\s*\\([^\\n]*(req\\.|request\\.|params|query|body)"
      - "os\\.system\\s*\\([^\\n]*(input|request|params|query|body)"
    remediation: Avoid shell execution with user input. Use safe APIs, argument arrays, strict allowlists, and disable shell interpretation.

  - id: SI-003
    severity: Critical
    category: Injection
    name: Code Injection
    description: User-controlled input appears to be evaluated as code or dynamically compiled.
    owasp_2025_category: "A05:2025 - Injection"
    cwe:
      - 94
    capec:
      - 242
    match_strategy: regex
    patterns:
      - "\\beval\\s*\\([^\\n]*(request|req\\.|params|query|body|input|user)"
      - "\\bexec\\s*\\([^\\n]*(request|req\\.|params|query|body|input|user)"
      - "new Function\\s*\\([^\\n]*(request|req\\.|params|query|body|input|user)"
      - "compile\\s*\\([^\\n]*(request|req\\.|params|query|body|input|user)"
      - "vm\\.runIn(NewContext|ThisContext|Context)\\s*\\("
    remediation: Do not evaluate user-controlled data as code. Replace dynamic evaluation with explicit parsing, allowlisted operations, or safe interpreters.

  - id: SI-004
    severity: High
    category: Injection
    name: NoSQL Injection
    description: User-controlled input appears to influence NoSQL query operators, filters, or raw query objects.
    owasp_2025_category: "A05:2025 - Injection"
    cwe:
      - 943
    capec:
      - 649
    match_strategy: regex
    patterns:
      - "(find|findOne|updateOne|updateMany|deleteOne|deleteMany)\\s*\\([^\\n]*(req\\.body|req\\.query|request\\.|params)"
      - "\\$where\\s*:"
      - "\\$regex\\s*:\\s*(req\\.|request\\.|params|query|body)"
      - "\\$ne\\s*:\\s*(req\\.|request\\.|params|query|body)"
      - "JSON\\.parse\\s*\\([^\\n]*(req\\.body|req\\.query|request\\.)"
    remediation: Build NoSQL queries from explicit allowlisted fields and operators. Reject operator injection keys such as `$where`, `$ne`, and `$regex` unless explicitly intended.

  - id: SI-005
    severity: High
    category: Injection
    name: LDAP Injection
    description: User-controlled input appears to be concatenated into LDAP filters or distinguished names.
    owasp_2025_category: "A05:2025 - Injection"
    cwe:
      - 90
    capec:
      - 136
    match_strategy: regex
    patterns:
      - "ldap[^\\n]*(search|filter)[^\\n]*(\\+|format\\(|\\$\\{|%\\s*\\()"
      - "\\(uid=\\s*['\"]?\\s*\\+"
      - "\\(cn=\\s*['\"]?\\s*\\+"
      - "DirContext\\.search\\s*\\([^\\n]*\\+"
      - "LdapQueryBuilder[^\\n]*(where|filter)[^\\n]*(request|req\\.|params|query|body)"
    remediation: Escape LDAP filter metacharacters and construct filters with safe LDAP APIs or strict allowlists.

  - id: SI-006
    severity: High
    category: Injection
    name: XXE / XML Injection
    description: XML parsing appears to allow external entities, DTDs, or unsafe XML resolver behavior.
    owasp_2025_category: "A05:2025 - Injection"
    cwe:
      - 611
    capec:
      - 197
    match_strategy: regex
    patterns:
      - "DocumentBuilderFactory\\.newInstance\\(\\)"
      - "SAXParserFactory\\.newInstance\\(\\)"
      - "XMLInputFactory\\.newInstance\\(\\)"
      - "resolve_entities\\s*=\\s*True"
      - "load_dtd\\s*=\\s*True"
      - "no_network\\s*=\\s*False"
      - "LIBXML_NOENT"
      - "XmlReaderSettings[^\\n]*DtdProcessing\\s*=\\s*DtdProcessing\\.Parse"
    remediation: Disable DTDs and external entity resolution. Use hardened XML parser settings and reject untrusted XML features.

  - id: SI-007
    severity: High
    category: Injection
    name: Expression / EL Injection
    description: User-controlled input appears to be evaluated by an expression language, template engine, or dynamic expression parser.
    owasp_2025_category: "A05:2025 - Injection"
    cwe:
      - 917
    capec: []
    match_strategy: regex
    patterns:
      - "ExpressionParser[^\\n]*parseExpression\\s*\\([^\\n]*(request|req\\.|params|query|body|input)"
      - "SpelExpressionParser[^\\n]*parseExpression\\s*\\("
      - "createExpression\\s*\\([^\\n]*(request|req\\.|params|query|body|input)"
      - "evaluate\\s*\\([^\\n]*(request|req\\.|params|query|body|input)"
      - "\\$\\{[^\\n}]*(request|req\\.|params|query|body|input)[^\\n}]*\\}"
      - "#\\{[^\\n}]*(request|req\\.|params|query|body|input)[^\\n}]*\\}"
    remediation: Do not evaluate user-controlled strings as expressions or templates. Use static templates, allowlisted variables, and sandboxed expression evaluation when unavoidable.
