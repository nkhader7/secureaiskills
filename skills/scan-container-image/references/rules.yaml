  - id: CIS-DOCKER-2-16
    recommendation_id: "2.16"
    severity: Medium
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "2"
    section_name: "Docker daemon configuration"
    name: "Ensure live restore is enabled"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      The `--live-restore` option enables full support of daemon-less containers within Docker. It ensures that Docker does not stop containers on shutdown or restore and that it properly reconnects to the container when restarted.
    rationale: |-
      One of the important security triads is availability. Setting the `--live-restore` flag within the Docker daemon ensures that container execution is not interrupted when it is not available. This also makes it easier to update and patch the Docker daemon without application downtime.
    impact: |-
      None.
    remediation: |-
      Run Docker in daemon mode and pass `--live-restore` to it as an argument.

      For Example,
      ```
      dockerd --live-restore
      ```
    audit_procedure: |-
      You should run `docker info` and ensure that the `Live Restore Enabled` property is set to `true`.

      ```
      docker info --format '{{ .LiveRestoreEnabled }}'
      ```

      Alternatively, you could run the below command and ensure that `--live-restore` is in use.

      ```
      grep "--live-restore" /etc/docker/daemon.json
      ```

      The contents of `/etc/docker/daemon.json` should also be reviewed to ensure this setting is in place.
    cis_controls: |-
      TITLE:Apply Secure Design Principles in Application Architectures CONTROL:v8 16.10 DESCRIPTION:Apply secure design principles in application architectures. Secure design principles include the concept of least privilege and enforcing mediation to validate every operation that the user makes, promoting the concept of "never trust user input." Examples include ensuring that explicit error checking is performed and documented for all input, including for size, data type, and acceptable ranges or formats. Secure design also means minimizing the application infrastructure attack surface, such as turning off unprotected ports and services, removing unnecessary programs and files, and renaming or removing default accounts.;TITLE:Application Software Security CONTROL:v7 18 DESCRIPTION:Application Software Security;
    evidence_examples:
