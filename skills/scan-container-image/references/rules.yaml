    remediation: |-
      You should ensure that no containers mount `docker.sock` as a volume.
    audit_procedure: |-
      You should run the following command:
      ```
      docker ps --quiet --all | xargs docker inspect --format '{{ .Id }}: Volumes={{ .Mounts }}' | grep docker.sock
