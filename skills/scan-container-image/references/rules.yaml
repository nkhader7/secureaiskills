  - id: CIS-DOCKER-4-1
    recommendation_id: "4.1"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "4"
    section_name: "Container Images and Build File Configuration"
    name: "Ensure that a user for the container has been created"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      Containers should run as a non-root user.
    rationale: |-
      It is good practice to run the container as a non-root user, where possible. This can be done either via the `USER` directive in the `Dockerfile` or through `gosu` or similar where used as part of the `CMD` or `ENTRYPOINT` directives.
    impact: |-
      Running as a non-root user can present challenges where you wish to bind mount volumes from the underlying host. In this case, care should be taken to ensure that the user running the contained process can read and write to the bound directory, according to their requirements.
    remediation: |-
      You should ensure that the Dockerfile for each container image contains the information below:
      ```
      USER <username or ID>
      ```
      In this case, the user name or ID refers to the user that was found in the container base image. If there is no specific user created in the container base image, then make use of the `useradd` command to add a specific user before the `USER` instruction in the Dockerfile.

      For example, add the below lines in the Dockerfile to create a user in the container:
      ```
      RUN useradd -d /home/username -m -s /bin/bash username
      USER username
      ```
      Note: If there are users in the image that are not needed, you should consider deleting them. After deleting those users, commit the image and then generate new instances of the containers.

      Alternatively, if it is not possible to set the `USER` directive in the Dockerfile, a script running as part of the `CMD` or `ENTRYPOINT` sections of the Dockerfile should be used to ensure that the container process switches to a non-root user.
    audit_procedure: |-
      You should run the following command

      ```
      docker ps --quiet | xargs --max-args=1 -I{} docker exec {} cat /proc/1/status | grep '^Uid:' | awk '{print $3}'
      ```
      This should return the effective UID for each container and where it returns 0, it indicates that the container process is running as root.

      Note that some services may start as the root user and then starts all other related processes as an unprivileged user.
    cis_controls: |-
      TITLE:Account Management CONTROL:v8 5 DESCRIPTION:Use processes and tools to assign and manage authorization to credentials for user accounts, including administrator accounts, as well as service accounts, to enterprise assets and software.;TITLE:Controlled Use of Administrative Privileges CONTROL:v7 4 DESCRIPTION:Controlled Use of Administrative Privileges;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
    source:
      benchmark: "CIS Docker Benchmark"
      version: "1.8.0"
      sheet: "Combined Profiles"

  - id: CIS-DOCKER-4-2
    recommendation_id: "4.2"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "4"
    section_name: "Container Images and Build File Configuration"
    name: "Ensure that containers use only trusted base images"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should ensure that container images you use are either written from scratch or are based on another established and trusted base image downloaded over a secure channel.
    rationale: |-
      Official repositories contain Docker images curated and optimized by the Docker community or by their vendor. There is no guarantee that these images are safe and do not contain security vulnerabilities or malicious code. Caution should therefore be exercised when obtaining container images from Docker and third parties and running these images should be reviewed in line with organizational security policy.
    impact: |-
      None.
    remediation: |-
      The following procedures are useful for establishing trust for a specific image.

      - Configure and use Docker Content trust.
      - View the history of each Docker image to evaluate its risk, dependent on the sensitivity of the application you wish to deploy using it.
      - Scan Docker images for vulnerabilities at regular intervals.
    audit_procedure: |-
      You should review what Docker images are present on the host by executing the command below:

      ```
      docker images
      ```

      This command lists all the container images that are currently available for use on the Docker host. You should then review the origin of each image and review its contents in line with your organization's security policy.

      You can use the command below to review the history of commits to the image.
      ```
      docker history <imageName>
      ```
    cis_controls: |-
      TITLE:Use Standard Hardening Configuration Templates for Application Infrastructure CONTROL:v8 16.7 DESCRIPTION:Use standard, industry-recommended hardening configuration templates for application infrastructure components. This includes underlying servers, databases, and web servers, and applies to cloud containers, Platform as a Service (PaaS) components, and SaaS components. Do not allow in-house developed software to weaken configuration hardening.;TITLE:Maintain Secure Images CONTROL:v7 5.2 DESCRIPTION:Maintain secure images or templates for all systems in the enterprise based on the organization's approved configuration standards. Any new system deployment or existing system that becomes compromised should be imaged using one of those images or templates.;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
