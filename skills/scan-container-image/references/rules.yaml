  - id: CIS-DOCKER-5-26
    recommendation_id: "5.26"
    severity: Medium
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "5"
    section_name: "Container Runtime Configuration"
    name: "Ensure that  the container is restricted from acquiring additional privileges"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should restrict the container from acquiring additional privileges via suid or sgid bits.
    rationale: |-
      A process can set the `no_new_priv` bit in the kernel and this persists across forks, clones and execve. The `no_new_priv` bit ensures that the process and its child processes do not gain any additional privileges via suid or sgid bits. This reduces the danger associated with many operations because the possibility of subverting privileged binaries is lessened.
    impact: |-
      The `no_new_priv` option prevents LSMs like SELinux from allowing processes to acquire new privileges
    remediation: |-
      You should start your container with the options below:

      ```
      docker run --rm -it --security-opt=no-new-privileges ubuntu bash
      ```
    audit_procedure: |-
      You should run the following command:

      ```
      docker ps --quiet --all | xargs docker inspect --format '{{ .Id }}: SecurityOpt={{ .HostConfig.SecurityOpt }}'
      ```

      This command should return all the security options currently configured for containers. `no-new-privileges` should be one of them.

      Note that the SecurityOpt response will be empty (i.e. `SecurityOpt=<no value>`) even if `"no-new-privileges": true` has been configured in the Docker daemon.json configuration file.
    cis_controls: |-
      TITLE:Restrict Administrator Privileges to Dedicated Administrator Accounts CONTROL:v8 5.4 DESCRIPTION:Restrict administrator privileges to dedicated administrator accounts on enterprise assets. Conduct general computing activities, such as internet browsing, email, and productivity suite use, from the user’s primary, non-privileged account.;TITLE:Controlled Use of Administrative Privileges CONTROL:v7 4 DESCRIPTION:Controlled Use of Administrative Privileges;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
