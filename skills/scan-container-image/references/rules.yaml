  - id: CIS-DOCKER-4-9
    recommendation_id: "4.9"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "4"
    section_name: "Container Images and Build File Configuration"
    name: "Ensure that COPY is used instead of ADD in Dockerfiles"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should use the `COPY` instruction instead of the `ADD` instruction in the Dockerfile.
    rationale: |-
      The `COPY` instruction simply copies files from the local host machine to the container file system. The `ADD` instruction could potentially retrieve files from remote URLs and perform operations such as unpacking them. The `ADD` instruction therefore introduces security risks. For example, malicious files may be directly accessed from URLs without scanning, or there may be vulnerabilities associated with decompressing them.
    impact: |-
      Care needs to be taken in implementing this control if the application requires functionality that is part of the `ADD` instruction, for example, if you need to retrieve files from remote URLs.
    remediation: |-
      You should use `COPY` rather than `ADD` instructions in Dockerfiles.
    audit_procedure: |-
      Run the command below to get the list of images:
      ```
      docker images
      ```

      Run the command below against each image in the list above and look for any `ADD` instructions:
      ```
      docker history <IMAGE ID>
      ```

      Alternatively, if you have access to the Dockerfile for the image, you should verify that there are no `ADD` instructions.
    cis_controls: |-
      TITLE:Use Standard Hardening Configuration Templates for Application Infrastructure CONTROL:v8 16.7 DESCRIPTION:Use standard, industry-recommended hardening configuration templates for application infrastructure components. This includes underlying servers, databases, and web servers, and applies to cloud containers, Platform as a Service (PaaS) components, and SaaS components. Do not allow in-house developed software to weaken configuration hardening.;TITLE:Maintain Secure Images CONTROL:v7 5.2 DESCRIPTION:Maintain secure images or templates for all systems in the enterprise based on the organization's approved configuration standards. Any new system deployment or existing system that becomes compromised should be imaged using one of those images or templates.;
