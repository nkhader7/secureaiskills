  - id: CIS-DOCKER-6-1
    recommendation_id: "6.1"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "6"
    section_name: "Docker Security Operations"
    name: "Ensure that image sprawl is avoided"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should not keep a large number of container images on the same host. Use only tagged images as appropriate.
    rationale: |-
      Tagged images are useful if you need to fall back from the "latest" version to a specific version of an image in production. Images with unused or old tags may contain vulnerabilities that might be exploited if instantiated.
    impact: |-
      `docker system prune -a` removes all exited containers as well as all images and volumes that are not referenced by running containers.
      If any images are removed, this would result in needing to reload the images to the host.
    remediation: |-
      You should keep only the images that you actually need and establish a workflow to remove old or stale images from the host. Additionally, you should use features such as pull-by-digest to get specific images from the registry.

      You can follow the steps below to find unused images on the system so they can be deleted.

      **Step 1** Make a list of all image IDs that are currently instantiated by executing the command below:

      ```
      docker images --quiet | xargs docker inspect --format '{{ .Id }}: Image={{ .Config.Image }}'
      ```

      **Step 2**: List all the images present on the system by executing the command below:
      ```
      docker images
      ```

      **Step 3**: Compare the list of image IDs created from Step 1 and Step 2 to find out images which are currently not being instantiated.

      **Step 4**: Decide if you want to keep the images that are not currently in use. If they are not needed, delete them by executing the following command:
      ```
      docker rmi <IMAGE ID>
      ```

      Alternatively, the `docker system prune` command can be used to remove dangling images which are not tagged or, if necessary, all images that are not currently used by a running container when used with the `-a` option.
    audit_procedure: |-
      **Step 1** Make a list of all image IDs that are currently instantiated by executing the command below:

      ```
      docker images --quiet | xargs docker inspect --format '{{ .Id }}: Image={{ .Config.Image }}'
      ```

      **Step 2**: List all the images present on the system by executing the command below:

      ```
      docker images
      ```

      **Step 3**: Compare the list of image IDs from Step 1 and Step 2 and look for images that are currently not in use. If any unused or old images are found, discuss with the system administrator the need to keep such images on the system. If images are no longer needed they should be deleted.
    cis_controls: |-
      TITLE:Apply Secure Design Principles in Application Architectures CONTROL:v8 16.10 DESCRIPTION:Apply secure design principles in application architectures. Secure design principles include the concept of least privilege and enforcing mediation to validate every operation that the user makes, promoting the concept of "never trust user input." Examples include ensuring that explicit error checking is performed and documented for all input, including for size, data type, and acceptable ranges or formats. Secure design also means minimizing the application infrastructure attack surface, such as turning off unprotected ports and services, removing unnecessary programs and files, and renaming or removing default accounts.;TITLE:Securely Store Master Images CONTROL:v7 5.3 DESCRIPTION:Store the master images and templates on securely configured servers, validated with integrity monitoring tools, to ensure that only authorized changes to the images are possible.;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
