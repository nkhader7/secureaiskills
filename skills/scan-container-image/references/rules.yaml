  - id: CIS-DOCKER-4-7
    recommendation_id: "4.7"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "4"
    section_name: "Container Images and Build File Configuration"
    name: "Ensure update instructions are not used alone in Dockerfiles"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should not use OS package manager update instructions such as `apt-get update` or `yum update` either alone or in a single line in any Dockerfiles used to generate images under review.
    rationale: |-
      Adding update instructions in a single line on the Dockerfile will cause the update layer to be cached. When you then build any image later using the same instruction, this will cause the previously cached update layer to be used, potentially preventing any fresh updates from being applied to later builds.
    impact: |-
      None
    remediation: |-
      You should use update instructions together with install instructions and version pinning for packages while installing them. This will prevent caching and force the extraction of the required versions.

      Alternatively, you could use the `--no-cache` flag during the `docker build` process to avoid using cached layers.
    audit_procedure: |-
      **Step 1:** Run the command below to get the list of images:
      ```
      docker images
      ```
      **Step 2:** Run the command below against each image in the list above, looking for any update instructions which are incorporated in a single line:
      ```
      docker history <Image_ID>
      ```
      Alternatively, if you have access to the Dockerfile for the image, you should verify that there are no update instructions configured as described above.
    cis_controls: |-
      TITLE:Use Standard Hardening Configuration Templates for Application Infrastructure CONTROL:v8 16.7 DESCRIPTION:Use standard, industry-recommended hardening configuration templates for application infrastructure components. This includes underlying servers, databases, and web servers, and applies to cloud containers, Platform as a Service (PaaS) components, and SaaS components. Do not allow in-house developed software to weaken configuration hardening.;TITLE:Maintain Secure Images CONTROL:v7 5.2 DESCRIPTION:Maintain secure images or templates for all systems in the enterprise based on the organization's approved configuration standards. Any new system deployment or existing system that becomes compromised should be imaged using one of those images or templates.;
    evidence_examples:
