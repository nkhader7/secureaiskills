  - id: CIS-DOCKER-7-8
    recommendation_id: "7.8"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker Swarm"
    section_id: "7"
    section_name: "Docker Swarm Configuration"
    name: "Ensure that CA certificates are rotated as appropriate"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should rotate root CA certificates as appropriate.
    rationale: |-
      Docker Swarm uses TLS for clustering operations between its nodes. Certificate rotation ensures that in an event such as a compromised node or key, it is difficult to impersonate a node. Node certificates depend upon root CA certificates. For operational security, it is important to rotate these frequently. Currently, root CA certificates are not rotated automatically and you should therefore establish a process for rotating them in line with your organizational security policy.
    impact: |-
      None
    remediation: |-
      You should run the command below to rotate a certificate.

      ```
      docker swarm ca --rotate
      ```
    audit_procedure: |-
      You should check the time stamp on the root CA certificate file.

      For example:
      ```
      ls -l /var/lib/docker/swarm/certificates/swarm-root-ca.crt
      ```
      The certificate should show a time stamp in line with the organizational rotation policy.
    cis_controls: |-
      TITLE:Use Unique Passwords CONTROL:v8 5.2 DESCRIPTION:Use unique passwords for all enterprise assets. Best practice implementation includes, at a minimum, an 8-character password for accounts using MFA and a 14-character password for accounts not using MFA. ;TITLE:Use Unique Passwords CONTROL:v7 4.4 DESCRIPTION:Where multi-factor authentication is not supported (such as local administrator, root, or service accounts), accounts will use passwords that are unique to that system.;
