      TITLE:Use Standard Hardening Configuration Templates for Application Infrastructure CONTROL:v8 16.7 DESCRIPTION:Use standard, industry-recommended hardening configuration templates for application infrastructure components. This includes underlying servers, databases, and web servers, and applies to cloud containers, Platform as a Service (PaaS) components, and SaaS components. Do not allow in-house developed software to weaken configuration hardening.;TITLE:Secure Configuration for Hardware and Software on Mobile Devices, Laptops, Workstations and Servers CONTROL:v7 5 DESCRIPTION:Secure Configuration for Hardware and Software on Mobile Devices, Laptops, Workstations and Servers;
