rules:
  - id: CIS-DOCKER-1-1-1
    recommendation_id: "1.1.1"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "1.1"
    section_name: "Linux Hosts Specific Configuration"
    name: "Ensure a separate partition for containers has been created"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      All Docker containers and their data and metadata is stored under `/var/lib/docker` directory. By default, `/var/lib/docker` should be mounted under either the `/` or `/var` partitions dependent on how the Linux operating system in use is configured.
    rationale: |-
      Docker depends on `/var/lib/docker` as the default directory where all Docker related files, including the images, are stored. This directory could fill up quickly causing both Docker and the host to become unusable. For this reason, you should create a separate partition (logical volume) for storing Docker files.
    impact: |-
      None.
    remediation: |-
      For new installations, you should create a separate partition for the `/var/lib/docker` mount point. For systems which have already been installed, you should use the Logical Volume Manager (LVM) within Linux to create a new partition.
    audit_procedure: |-
      At the Docker host execute one of the below commands:

      ```
      grep '/var/lib/docker\s' /proc/mounts
      ```

      This should return the partition details for the `/var/lib/docker` mountpoint.

      ```
      mountpoint -- "$(docker info -f '{{ .DockerRootDir }}')"
      ```

      This should return whether the configured root directory is a mount point.
    cis_controls: |-
      TITLE:Segment Data Processing and Storage Based on Sensitivity CONTROL:v8 3.12 DESCRIPTION:Segment data processing and storage based on the sensitivity of the data. Do not process sensitive data on enterprise assets intended for lower sensitivity data.;TITLE:Controlled Access Based on the Need to Know CONTROL:v7 14 DESCRIPTION:Controlled Access Based on the Need to Know;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
    source:
      benchmark: "CIS Docker Benchmark"
      version: "1.8.0"
      sheet: "Combined Profiles"

  - id: CIS-DOCKER-1-1-2
    recommendation_id: "1.1.2"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "1.1"
    section_name: "Linux Hosts Specific Configuration"
    name: "Ensure only trusted users are allowed to control Docker daemon"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      The Docker daemon currently requires access to the Docker socket which is, by default, owned by the user `root` and the group `docker`.
    rationale: |-
      Docker allows you to share a directory between the Docker host and a guest container without limiting the access rights of the container. This means that you can start a container and map the `/` directory on your host to the container. The container would then be able to modify your host file system without any restrictions. This means that you could gain elevated privileges simply by being a member of the `docker` group and subsequently start a container which maps the root `/` directory on the host.
    impact: |-
      Provided the proceeding instructions are implemented, rights to build and execute containers as normal user would be restricted.
    remediation: |-
      You should remove any untrusted users from the `docker` group. Additionally, you should not create a mapping of sensitive directories from the host to container volumes.
    audit_procedure: |-
      Execute the following command on the docker host and ensure that only trusted users are members of the `docker` group.
      ```
      getent group docker
      ```
    cis_controls: |-
      TITLE:Establish an Access Granting Process CONTROL:v8 6.1 DESCRIPTION:Establish and follow a process, preferably automated, for granting access to enterprise assets upon new hire, rights grant, or role change of a user.;TITLE:Controlled Use of Administrative Privileges CONTROL:v7 4 DESCRIPTION:Controlled Use of Administrative Privileges;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
    source:
      benchmark: "CIS Docker Benchmark"
      version: "1.8.0"
      sheet: "Combined Profiles"

  - id: CIS-DOCKER-1-1-3
    recommendation_id: "1.1.3"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "1.1"
    section_name: "Linux Hosts Specific Configuration"
    name: "Ensure auditing is configured for the Docker daemon"
    assessment_status: "Automated"
    match_strategy: cis_docker_review
    description: |-
      Audit all Docker daemon activities.
    rationale: |-
      As well as auditing the normal Linux file system and system calls, you should also audit the Docker daemon. Because this daemon runs with `root` privileges. It is very important to audit its activities and usage.
    impact: |-
      Auditing can generate large log files. You should ensure that these are rotated and archived periodically. A separate partition should also be created for audit logs to avoid filling up any other critical partition.
    remediation: |-
      You should add rules for the Docker daemon.

      For example:

      Add the line below to the `/etc/audit/rules.d/audit.rules` file:
      ```
      -w /usr/bin/dockerd -k docker
      ```

      Then, restart the audit daemon using the following command

      ```
      systemctl restart auditd
      ```
    audit_procedure: |-
      Verify that there are audit rules for the Docker daemon. For example, you could execute the following command:

      ```
      auditctl -l | grep /usr/bin/dockerd
      ```

      This should show the rules associated with the Docker daemon.
    cis_controls: |-
      TITLE:Collect Audit Logs CONTROL:v8 8.2 DESCRIPTION:Collect audit logs. Ensure that logging, per the enterprise’s audit log management process, has been enabled across enterprise assets.;TITLE:Activate audit logging CONTROL:v7 6.2 DESCRIPTION:Ensure that local logging has been enabled on all systems and networking devices.;TITLE:Enable Detailed Logging CONTROL:v7 6.3 DESCRIPTION:Enable system logging to include detailed information such as an event source, date, user, timestamp, source addresses, destination addresses, and other useful elements.;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
    source:
      benchmark: "CIS Docker Benchmark"
      version: "1.8.0"
      sheet: "Combined Profiles"

  - id: CIS-DOCKER-1-1-4
    recommendation_id: "1.1.4"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "1.1"
    section_name: "Linux Hosts Specific Configuration"
    name: "Ensure auditing is configured for Docker files and directories - /run/containerd"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      Audit `/run/containerd`.
    rationale: |-
      As well as auditing the normal Linux file system and system calls, you should also audit all Docker related files and directories. The Docker daemon runs with `root` privileges and its behaviour depends on some key files and directories. `/run/containerd` is one such directory. As it holds all the information about containers it should be audited.
    impact: |-
      Auditing can generate large log files. You should ensure that these are rotated and archived periodically. A separate partition should also be created for audit logs to avoid filling up any other critical partition.
    remediation: |-
      You should add a rule for the `/run/containerd` directory.

      For example,

      Add the line as below to the `/etc/audit/rules.d/audit.rules` file:
      ```
      -a exit,always -F path=/run/containerd -F perm=war -k docker
      ```

      Then, restart the audit daemon using the following command

      ```
      systemctl restart auditd
      ```
    audit_procedure: |-
      You should verify that there is an audit rule applied to the `/run/containerd` directory.

      For example, you could execute the command below:
      ```
      auditctl -l | grep /run/containerd
      ```
      This should list a rule for the `/run/containerd` directory.
    cis_controls: |-
      TITLE:Collect Detailed Audit Logs CONTROL:v8 8.5 DESCRIPTION:Configure detailed audit logging for enterprise assets containing sensitive data. Include event source, date, username, timestamp, source addresses, destination addresses, and other useful elements that could assist in a forensic investigation.;TITLE:Enforce Detail Logging for Access or Changes to Sensitive Data CONTROL:v7 14.9 DESCRIPTION:Enforce detailed audit logging for access to sensitive data or changes to sensitive data (utilizing tools such as File Integrity Monitoring or Security Information and Event Monitoring).;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
    source:
      benchmark: "CIS Docker Benchmark"
      version: "1.8.0"
      sheet: "Combined Profiles"

  - id: CIS-DOCKER-1-1-5
    recommendation_id: "1.1.5"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "1.1"
    section_name: "Linux Hosts Specific Configuration"
    name: "Ensure auditing is configured for Docker files and directories - /var/lib/docker"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      Audit `/var/lib/docker` or data-root.
    rationale: |-
      As well as auditing the normal Linux file system and system calls, you should also audit all Docker related files and directories. The Docker daemon runs with `root` privileges and its behaviour depends on some key files and directories. `/var/lib/docker` is one such directory. As it holds all the information about containers it should be audited.
    impact: |-
      Auditing can generate large log files. You should ensure that these are rotated and archived periodically. A separate partition should also be created for audit logs to avoid filling up any other critical partition.
    remediation: |-
      You should add a rule for the `/var/lib/docker` directory.
      Adding exclusions for /var/lib/docker/overlay2 & /var/lib/docker/volumes reduces the audit messages to a more manageable level.

      For example,

      Add the line as below to the `/etc/audit/rules.d/audit.rules` file:
      ```
      -a exit,always -F path=/var/lib/docker -F perm=war -k docker
      -a exit,never -F dir=/var/lib/docker/volumes
      -a exit,never -F dir=/var/lib/docker/overlay2
      ```
      or for systems with namespace-remapping enabled
      ```
      -a exit,always -F path=/var/lib/docker -F perm=war -k docker
      -a exit,never -F dir=/var/lib/docker/165536.165536/volumes
      -a exit,never -F dir=/var/lib/docker/165536.165536/overlay2
      ```

      Then, restart the audit daemon using the following command

      ```
      systemctl restart auditd
      ```
    audit_procedure: |-
      You should verify that there is an audit rule applied to the `/var/lib/docker` directory or whatever your data-root directory is set to.

      You can configure the Docker daemon to use a different directory, using the data-root configuration option. For example:

      ```
      {
       "data-root"; "/mnt/docker-data"
      }
      ```

      To perform an audit execute the command below:
      ```
      auditctl -l | grep /var/lib/docker
      ```
      or
      ```
      auditctl -l | grep data-root
      ```

      This should list a rule for the `/var/lib/docker` directory.
    cis_controls: |-
      TITLE:Collect Detailed Audit Logs CONTROL:v8 8.5 DESCRIPTION:Configure detailed audit logging for enterprise assets containing sensitive data. Include event source, date, username, timestamp, source addresses, destination addresses, and other useful elements that could assist in a forensic investigation.;TITLE:Enforce Detail Logging for Access or Changes to Sensitive Data CONTROL:v7 14.9 DESCRIPTION:Enforce detailed audit logging for access to sensitive data or changes to sensitive data (utilizing tools such as File Integrity Monitoring or Security Information and Event Monitoring).;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
    source:
      benchmark: "CIS Docker Benchmark"
      version: "1.8.0"
      sheet: "Combined Profiles"

