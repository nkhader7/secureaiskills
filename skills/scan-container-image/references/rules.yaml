  - id: CIS-DOCKER-5-3
    recommendation_id: "5.3"
    severity: High
    category: CIS Docker Benchmark
    profile: "Level 2 - Docker - Linux"
    section_id: "5"
    section_name: "Container Runtime Configuration"
    name: "Ensure that, if applicable, SELinux security options are set"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      SELinux is an effective and easy-to-use Linux application security system. It is available by default on some distributions such as Red Hat and Fedora.
    rationale: |-
      SELinux provides a Mandatory Access Control (MAC) system that greatly augments the default Discretionary Access Control (DAC) model. You can therefore add an extra layer of safety to your containers by enabling SELinux on your Linux host.
    impact: |-
      Any restrictions defined in the SELinux policy will be applied to your containers. It should be noted that if your SELinux policy is misconfigured, this may have an impact on the correct operation of the affected containers.
    remediation: |-
      If SELinux is applicable for your Linux OS, you should use it.

      1. Set the SELinux State.
      2. Set the SELinux Policy.
      3. Create or import a SELinux policy template for Docker containers.
      4. Start Docker in daemon mode with SELinux enabled. For example:

      ```
      docker daemon --selinux-enabled
      ```

      or by adding the following to the `daemon.json` configuration file:

      ```
      {
       "selinux-enabled": true
      }
      ```

      5. Start your Docker container using the security options. For example,

      ```
      docker run --interactive --tty --security-opt label=level:TopSecret centos /bin/bash
      ```
    audit_procedure: |-
      You should run the following command

      ```
      docker ps --quiet --all | xargs docker inspect --format '{{ .Id }}: SecurityOpt={{ .HostConfig.SecurityOpt }} MountLabel={{ .MountLabel }} ProcessLabel={{ .ProcessLabel }}'
      ```

      This command returns all the security options currently configured on the containers listed. Note that even if an empty `SecurityOpt` is returned, the `MountLabel` and `ProcessLabel` values will indicate if SELinux is in use.
    cis_controls: |-
      TITLE:Enable Anti-Exploitation Features CONTROL:v8 10.5 DESCRIPTION:Enable anti-exploitation features on enterprise assets and software, where possible, such as Microsoft® Data Execution Prevention (DEP), Windows® Defender Exploit Guard (WDEG), or Apple® System Integrity Protection (SIP) and Gatekeeper™.;TITLE:Maintain Secure Images CONTROL:v7 5.2 DESCRIPTION:Maintain secure images or templates for all systems in the enterprise based on the organization's approved configuration standards. Any new system deployment or existing system that becomes compromised should be imaged using one of those images or templates.;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
