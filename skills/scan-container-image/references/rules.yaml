  - id: CIS-DOCKER-7-7
    recommendation_id: "7.7"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker Swarm"
    section_id: "7"
    section_name: "Docker Swarm Configuration"
    name: "Ensure that node certificates are rotated as appropriate"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should rotate swarm node certificates in line with your organizational security policy.
    rationale: |-
      Docker Swarm uses TLS for clustering operations between its nodes. Certificate rotation ensures that in an event such as a compromised node or key, it is difficult to impersonate a node. By default, node certificates are rotated every 90 days, but you should rotate them more often or as appropriate in your environment.
    impact: |-
      None
    remediation: |-
      You should run the command to set the desired expiry time on the node certificate.

      For example:
      ```
      docker swarm update --cert-expiry 48h
      ```
    audit_procedure: |-
      Run one of the commands below and ensure that the node certificate `Expiry Duration` is set as appropriate.
      ```
      docker info | grep "Expiry Duration"
      ```
      ```
      docker info --format 'NodeCertExpiry: {{ .Swarm.Cluster.Spec.CAConfig.NodeCertExpiry }}'
      ```
    cis_controls: |-
      TITLE:Use Unique Passwords CONTROL:v8 5.2 DESCRIPTION:Use unique passwords for all enterprise assets. Best practice implementation includes, at a minimum, an 8-character password for accounts using MFA and a 14-character password for accounts not using MFA. ;TITLE:Use Unique Passwords CONTROL:v7 4.4 DESCRIPTION:Where multi-factor authentication is not supported (such as local administrator, root, or service accounts), accounts will use passwords that are unique to that system.;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
