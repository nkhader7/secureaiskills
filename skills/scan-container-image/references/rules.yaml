  - id: CIS-DOCKER-1-1-7
    recommendation_id: "1.1.7"
    severity: High
    category: CIS Docker Benchmark
    profile: "Level 2 - Docker - Linux"
    section_id: "1.1"
    section_name: "Linux Hosts Specific Configuration"
    name: "Ensure auditing is configured for Docker files and directories - docker.service"
    assessment_status: "Automated"
    match_strategy: cis_docker_review
    description: |-
      Audit the `docker.service` if applicable.
    rationale: |-
      As well as auditing the normal Linux file system and system calls, you should also audit all Docker related files and directories. The Docker daemon runs with `root` privileges and its behavior depends on some key files and directories with `docker.service` being one such file. The `docker.service` file might be present if the daemon parameters have been changed by an administrator. If so, it holds various parameters for the Docker daemon and should be audited.
    impact: |-
      Auditing can generate large log files. You should ensure that these are rotated and archived periodically. A separate partition should also be created for audit logs to avoid filling up any other critical partition.
    remediation: |-
      If the file exists, a rule for it should be added.

      For example:

      Add the line as below in `/etc/audit/rules.d/audit.rules` file:
      ```
      -w /usr/lib/systemd/system/docker.service -k docker
      ```
      Then restart the audit daemon.

      For example:
      ```
      systemctl restart auditd
      ```
    audit_procedure: |-
      **Step 1**: Find out the file location:
      ```
      systemctl show -p FragmentPath docker.service
      ```

      **Step 2**: If the file does not exist, this recommendation does not apply. If the file does exist, verify that there is an audit rule corresponding to the file:

      For example, you could execute the command below:
      ```
      auditctl -l | grep docker.service
      ```
      This should display a rule for `docker.service`.
    cis_controls: |-
      TITLE:Collect Detailed Audit Logs CONTROL:v8 8.5 DESCRIPTION:Configure detailed audit logging for enterprise assets containing sensitive data. Include event source, date, username, timestamp, source addresses, destination addresses, and other useful elements that could assist in a forensic investigation.;TITLE:Enforce Detail Logging for Access or Changes to Sensitive Data CONTROL:v7 14.9 DESCRIPTION:Enforce detailed audit logging for access to sensitive data or changes to sensitive data (utilizing tools such as File Integrity Monitoring or Security Information and Event Monitoring).;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
