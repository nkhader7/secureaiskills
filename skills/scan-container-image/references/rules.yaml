  - id: CIS-DOCKER-4-6
    recommendation_id: "4.6"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "4"
    section_name: "Container Images and Build File Configuration"
    name: "Ensure that HEALTHCHECK instructions have been added to container images"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should add the `HEALTHCHECK` instruction to your Docker container images in order to ensure that health checks are executed against running containers.
    rationale: |-
      An important security control is that of availability. Adding the `HEALTHCHECK` instruction to your container image ensures that the Docker engine periodically checks the running container instances against that instruction to ensure that containers are still operational.

      Based on the results of the health check, the Docker engine could terminate containers which are not responding correctly, and instantiate new ones.
    impact: |-
      None.
    remediation: |-
      You should follow the Docker documentation and rebuild your container images to include the `HEALTHCHECK` instruction.
    audit_procedure: |-
      You should run the command below to ensure that Docker images have the appropriate `HEALTHCHECK` instruction configured.

      ```
      docker inspect --format='{{ .Config.Healthcheck }}' <IMAGE>
      ```
    cis_controls: |-
      TITLE:Implement Code-Level Security Checks CONTROL:v8 16.12 DESCRIPTION:Apply static and dynamic analysis tools within the application life cycle to verify that secure coding practices are being followed.;TITLE:Maintain Secure Images CONTROL:v7 5.2 DESCRIPTION:Maintain secure images or templates for all systems in the enterprise based on the organization's approved configuration standards. Any new system deployment or existing system that becomes compromised should be imaged using one of those images or templates.;
