  - id: CIS-DOCKER-3-1
    recommendation_id: "3.1"
    severity: Medium
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "3"
    section_name: "Docker daemon configuration files"
    name: "Ensure that the docker.service file ownership is set to root:root"
    assessment_status: "Automated"
    match_strategy: cis_docker_review
    description: |-
      You should verify that the `docker.service` file ownership and group ownership are correctly set to `root`.
    rationale: |-
      The `docker.service` file contains sensitive parameters that may alter the behavior of the Docker daemon. It should therefore be individually and group owned by the `root` user in order to ensure that it is not modified or corrupted by a less privileged user.
    impact: |-
      None.
    remediation: |-
      **Step 1**: Find out the file location:
      ```
      systemctl show -p FragmentPath docker.service
      ```

      **Step 2**: If the file does not exist, this recommendation is not applicable. If the file does exist, you should execute the command below, including the correct file path, in order to set the ownership and group ownership for the file to `root`.

      For example,
      ```
      chown root:root /usr/lib/systemd/system/docker.service
      ```
    audit_procedure: |-
      **Step 1**: Find out the file location:
      ```
      systemctl show -p FragmentPath docker.service
      ```

      **Step 2**: If the file does not exist, this recommendation is not applicable. If the file exists, execute the command below including the correct file path in order to verify that the file is owned and group owned by `root`.

      For example:
      ```
      stat -c %U:%G /usr/lib/systemd/system/docker.service | grep -v root:root
      ```
      The command above should not return anything.
    cis_controls: |-
      TITLE:Restrict Administrator Privileges to Dedicated Administrator Accounts CONTROL:v8 5.4 DESCRIPTION:Restrict administrator privileges to dedicated administrator accounts on enterprise assets. Conduct general computing activities, such as internet browsing, email, and productivity suite use, from the user’s primary, non-privileged account.;TITLE:Controlled Use of Administrative Privileges CONTROL:v7 4 DESCRIPTION:Controlled Use of Administrative Privileges;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
