  - id: CIS-DOCKER-5-29
    recommendation_id: "5.29"
    severity: Medium
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "5"
    section_name: "Container Runtime Configuration"
    name: "Ensure that the PIDs cgroup limit is used"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should use the `--pids-limit` flag at container runtime.
    rationale: |-
      Attackers could launch a fork bomb with a single command inside the container. This fork bomb could crash the entire system and would require a restart of the host to make the system functional again. Using the PIDs cgroup parameter `--pids-limit` would prevent this kind of attack by restricting the number of forks that can happen inside a container within a specified time frame.
    impact: |-
      Set the PIDs limit value as appropriate. Incorrect values might leave containers unusable.
    remediation: |-
      Use `--pids-limit` flag with an appropriate value when launching the container.

      For example:
      ```
      docker run -it --pids-limit 100 <Image ID>
      ```
      In the above example, the number of processes allowed to run at any given time is set to 100. After a limit of 100 concurrently running processes is reached, Docker would restrict any new process creation.
    audit_procedure: |-
      You should run the command below and ensure that `PidsLimit` is not set to 0 or -1. A `PidsLimit` of 0 or -1 means that any number of processes can be forked concurrently inside the container.

      ```
      docker ps --quiet --all | xargs docker inspect --format '{{ .Id }}: PidsLimit={{ .HostConfig.PidsLimit }}'
      ```
    cis_controls: |-
      TITLE:Secure Configuration of Enterprise Assets and Software CONTROL:v8 4 DESCRIPTION:Establish and maintain the secure configuration of enterprise assets (end-user devices, including portable and mobile; network devices; non-computing/IoT devices; and servers) and software (operating systems and applications).;TITLE:Maintain Secure Images CONTROL:v7 5.2 DESCRIPTION:Maintain secure images or templates for all systems in the enterprise based on the organization's approved configuration standards. Any new system deployment or existing system that becomes compromised should be imaged using one of those images or templates.;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
