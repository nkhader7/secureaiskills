  - id: CIS-DOCKER-5-6
    recommendation_id: "5.6"
    severity: Medium
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "5"
    section_name: "Container Runtime Configuration"
    name: "Ensure sensitive host system directories are not mounted on containers"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should not allow sensitive host system directories such as those listed below to be mounted as container volumes, especially in read-write mode.

      ```
      /
      /boot
      /dev
      /etc
      /lib
      /lib64
      /proc
      /sys
      /usr
      ```
    rationale: |-
      If sensitive directories are mounted in read-write mode, it could be possible to make changes to files within them. This has obvious security implications and should be avoided.
    impact: |-
      None.
    remediation: |-
      You should not mount directories which are security sensitive on the host within containers, especially in read-write mode.
    audit_procedure: |-
      You should run the following command:
      ```
      docker ps --quiet --all | xargs docker inspect --format '{{ .Id }}: Volumes={{ .Mounts }}'
      ```
      This command returns a list of currently mapped directories and indicates whether they are mounted in read-write mode for each container instance.
    cis_controls: |-
      TITLE:Data Protection CONTROL:v8 3 DESCRIPTION:Develop processes and technical controls to identify, classify, securely handle, retain, and dispose of data.;TITLE:Data Protection CONTROL:v7 13 DESCRIPTION:Data Protection;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
