  - id: CIS-DOCKER-7-9
    recommendation_id: "7.9"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker Swarm"
    section_id: "7"
    section_name: "Docker Swarm Configuration"
    name: "Ensure that management plane traffic is separated from data plane traffic"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should separate management plane traffic from data plane traffic.
    rationale: |-
      Separating management plane traffic from data plane traffic ensures that these types of traffic are segregated from each other. These traffic flows can then be individually monitored and tied to different traffic control policies and monitoring. This also ensures that the management plane is always reachable even if there is a great deal of traffic on the data plane.
    impact: |-
      This requires two network interfaces per node.
    remediation: |-
      You should initialize the swarm with dedicated interfaces for management and data planes respectively.

      For example,
      ```
      docker swarm init --advertise-addr=192.168.0.1 --data-path-addr=17.1.0.3
      ```
    audit_procedure: |-
      You should run the command below on each swarm node and ensure that the management plane address is different from the data plane address.

      ```
      docker node inspect --format '{{ .Status.Addr }}' self
      ```
    cis_controls: |-
      TITLE:Perform Traffic Filtering Between Network Segments CONTROL:v8 13.4 DESCRIPTION:Perform traffic filtering between network segments, where appropriate.;TITLE:Segment the Network Based on Sensitivity CONTROL:v7 14.1 DESCRIPTION:Segment the network based on the label or classification level of the information stored on the servers, locate all sensitive information on separated Virtual Local Area Networks (VLANs).;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
