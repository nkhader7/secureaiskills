  - id: CIS-DOCKER-5-4
    recommendation_id: "5.4"
    severity: High
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "5"
    section_name: "Container Runtime Configuration"
    name: "Ensure that Linux kernel capabilities are restricted within containers"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      By default, Docker starts containers with a restricted set of Linux kernel capabilities. This means that any process can be granted the required capabilities instead of giving it root access. Using Linux kernel capabilities, processes in general do not need to run as the root user.
    rationale: |-
      Docker supports the addition and removal of capabilities. You should remove all capabilities not required for the correct function of the container.

      Specifically, in the default capability set provided by Docker, the `NET_RAW` capability should be removed if not explicitly required, as it can give an attacker with access to a container the ability to create spoofed network traffic.
    impact: |-
      Restrictions on processes within a container are based on which Linux capabilities are in force.
    remediation: |-
      You should execute the command below to add required capabilities:

      ```
      docker run --cap-add={"Capability 1","Capability 2"} <Run arguments> <Container Image Name or ID> <Command>
      ```

      You should execute the command below to remove unneeded capabilities:
      ```
      docker run --cap-drop={"Capability 1","Capability 2"} <Run arguments> <Container Image Name or ID> <Command>
      ```

      Alternatively, you could remove all the currently configured capabilities and then restore only the ones you specifically use:
      ```
      docker run --cap-drop=all --cap-add={"Capability 1","Capability 2"} <Run arguments> <Container Image Name or ID> <Command>
      ```

      Note that some settings also can be configured using the `--sysctl` option, reducing the need for container capabilities even further. This includes unprivileged ICMP echo sockets without `NET_RAW` and allow opening any port less than 1024 without `NET_BIND_SERVICE`.

      Adding and removing capabilities are also possible when the `docker service` command is used:
      ```
      docker service create --cap-drop=all --cap-add={"Capability 1","Capability 2"} <Run arguments> <Container Image Name or ID> <Command>
      ```
    audit_procedure: |-
      You should run the following command:

      ```
      docker ps --quiet --all | xargs docker inspect --format '{{ .Id }}: CapAdd={{ .HostConfig.CapAdd }} CapDrop={{ .HostConfig.CapDrop }}'
      ```
      Verify that the added and deleted Linux kernel capabilities are in line with the ones needed by the container process in each container instance. Specifically, ensure that the `NET_RAW` capability is removed if not required.
    cis_controls: |-
      TITLE:Use Standard Hardening Configuration Templates for Application Infrastructure CONTROL:v8 16.7 DESCRIPTION:Use standard, industry-recommended hardening configuration templates for application infrastructure components. This includes underlying servers, databases, and web servers, and applies to cloud containers, Platform as a Service (PaaS) components, and SaaS components. Do not allow in-house developed software to weaken configuration hardening.;TITLE:Maintain Secure Images CONTROL:v7 5.2 DESCRIPTION:Maintain secure images or templates for all systems in the enterprise based on the organization's approved configuration standards. Any new system deployment or existing system that becomes compromised should be imaged using one of those images or templates.;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
    source:
      benchmark: "CIS Docker Benchmark"
      version: "1.8.0"
      sheet: "Combined Profiles"

  - id: CIS-DOCKER-5-5
    recommendation_id: "5.5"
    severity: High
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "5"
    section_name: "Container Runtime Configuration"
    name: "Ensure that privileged containers are not used"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      Using the `--privileged` flag provides all Linux kernel capabilities to the container to which it is applied and therefore overwrites the `--cap-add` and `--cap-drop` flags. For this reason you should ensure that it is not used.
    rationale: |-
      The `--privileged` flag provides all capabilities to the container to which it is applied, and also lifts all the limitations enforced by the device cgroup controller. As a consequence this the container has most of the rights of the underlying host. This flag only exists to allow for specific use cases (for example running Docker within Docker) and should not generally be used.
    impact: |-
      If you start a container without the `--privileged` flag, it will not have excessive default capabilities.
    remediation: |-
      You should not run containers with the `--privileged` flag.

      For example, do not start a container using the command below:
      ```
      docker run --interactive --tty --privileged centos /bin/bash
      ```
    audit_procedure: |-
      You should run the command below:
      ```
      docker ps --quiet --all | xargs docker inspect --format '{{ .Id }}: Privileged={{ .HostConfig.Privileged }}'
      ```
      The above command should return `Privileged=false` for each container instance.
    cis_controls: |-
      TITLE:Restrict Administrator Privileges to Dedicated Administrator Accounts CONTROL:v8 5.4 DESCRIPTION:Restrict administrator privileges to dedicated administrator accounts on enterprise assets. Conduct general computing activities, such as internet browsing, email, and productivity suite use, from the user’s primary, non-privileged account.;TITLE:Controlled Use of Administrative Privileges CONTROL:v7 4 DESCRIPTION:Controlled Use of Administrative Privileges;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
