  - id: CIS-DOCKER-7-5
    recommendation_id: "7.5"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker Swarm"
    section_id: "7"
    section_name: "Docker Swarm Configuration"
    name: "Ensure that swarm manager is run in auto-lock mode"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should review whether you wish to run Docker swarm manager in auto-lock mode.
    rationale: |-
      When Docker restarts, both the TLS key used to encrypt communication among swarm nodes, and the key used to encrypt and decrypt Raft logs on disk, are loaded into each manager node's memory. You could protect the mutual TLS encryption key and the key used to encrypt and decrypt Raft logs at rest. This protection could be enabled by initializing the swarm with the `--autolock` flag.

      With `--autolock `enabled, when Docker restarts, you must unlock the swarm first, using a key encryption key generated by Docker when the swarm was initialized.

      This has benefits in a high security environment, however these should be balanced against the support issues caused by the swarm not starting automatically if, for example the host were to experience an outage.
    impact: |-
      A swarm in auto-lock mode will not recover from a restart without manual intervention from an administrator to enter the unlock key. This may not always be desirable, and should be reviewed at a policy level.
    remediation: |-
      If you are initializing a swarm, use the command below.
      ```
      docker swarm init --autolock
      ```
      If you want to set `--autolock` on an existing swarm manager node, use the following command.
      ```
      docker swarm update --autolock
      ```
    audit_procedure: |-
      You should run the command below
      ```
      docker info --format 'Swarm Autolock: {{ .Swarm.Cluster.Spec.EncryptionConfig.AutoLockManagers }}'
      ```
      If the result is `true`, auto-lock mode is enable.

      You could also run the command below. If a key value is returned, it means that the swarm was initialized with the `--autolock` flag. If the output is `no unlock key is set`, it means that swarm was NOT initialized with the `--autolock` flag. This should be reviewed in line with the organization's IT Security policy.
      ```
      docker swarm unlock-key
      ```
    cis_controls: |-
      TITLE:Encrypt Sensitive Data at Rest CONTROL:v8 3.11 DESCRIPTION:Encrypt sensitive data at rest on servers, applications, and databases containing sensitive data. Storage-layer encryption, also known as server-side encryption, meets the minimum requirement of this Safeguard. Additional encryption methods may include application-layer encryption, also known as client-side encryption, where access to the data storage device(s) does not permit access to the plain-text data. ;TITLE:Encrypt Sensitive Information at Rest CONTROL:v7 14.8 DESCRIPTION:Encrypt all sensitive information at rest using a tool that requires a secondary authentication mechanism not integrated into the operating system, in order to access the information.;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
    source:
      benchmark: "CIS Docker Benchmark"
      version: "1.8.0"
      sheet: "Combined Profiles"

  - id: CIS-DOCKER-7-6
    recommendation_id: "7.6"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker Swarm"
    section_id: "7"
    section_name: "Docker Swarm Configuration"
    name: "Ensure that the swarm manager auto-lock key is rotated periodically"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should rotate the swarm manager auto-lock key periodically.
    rationale: |-
      The swarm manager auto-lock key is not automatically rotated. Good security practice is to rotate keys.
    impact: |-
      None
    remediation: |-
      You should run the command below to rotate the keys.
      ```
      docker swarm unlock-key --rotate
      ```
      Additionally, to facilitate auditing of this recommendation, you should maintain key rotation records and ensure that you establish a pre-defined frequency for key rotation.
    audit_procedure: |-
      Currently, there is no mechanism to find out when the key was last rotated on a swarm manager node. You should check with the system administrator to see if there is a key rotation process, and how often the key is rotated.
    cis_controls: |-
      TITLE:Use Unique Passwords CONTROL:v8 5.2 DESCRIPTION:Use unique passwords for all enterprise assets. Best practice implementation includes, at a minimum, an 8-character password for accounts using MFA and a 14-character password for accounts not using MFA. ;TITLE:Use Unique Passwords CONTROL:v7 4.4 DESCRIPTION:Where multi-factor authentication is not supported (such as local administrator, root, or service accounts), accounts will use passwords that are unique to that system.;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
