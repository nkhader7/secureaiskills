  - id: CIS-DOCKER-1-2-2
    recommendation_id: "1.2.2"
    severity: Low
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "1.2"
    section_name: "General Configuration"
    name: "Ensure that the version of Docker is up to date"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      Frequent releases for Docker are issued which address security vulnerabilities, resolve product bugs and bring in new functionality. You should keep a tab on these product updates and upgrade as frequently as possible in line with the general IT security policy of your organization.
    rationale: |-
      By staying up to date on Docker updates, vulnerabilities in the software can be mitigated. An experienced attacker may be able to exploit known vulnerabilities resulting in them being able to attain inappropriate access or to elevate their privileges. If you do not ensure that Docker is running at the most current release consistent with the requirements of of your application, you may introduce unwanted behaviour and it is therefore important to ensure that you monitor software versions and upgrade in a timely fashion.
    impact: |-
      You should perform a risk assessment regarding Docker version updates and review how they may impact your operations. You should be aware that third-party products that use Docker may require older major versions of Docker to be supported, and this should be reviewed in line with the general IT security policy of your organization, particularly where security vulnerabilities in older versions have been publicly disclosed.
    remediation: |-
      You should monitor versions of Docker releases and make sure your software is updated as required.
    audit_procedure: |-
      You should execute the command below in order to verify that the Docker version is up to date in line with the requirements of the application you are running. It should be noted that it is not a security requirement to be at the most up to date version, provided the version you are using does not contain any critical or high security vulnerabilities.
      ```
      docker version
      ```
    cis_controls: |-
      TITLE:Use Up-to-Date and Trusted Third-Party Software Components CONTROL:v8 16.5 DESCRIPTION:Use up-to-date and trusted third-party software components. When possible, choose established and proven frameworks and libraries that provide adequate security. Acquire these components from trusted sources or evaluate the software for vulnerabilities before use.;TITLE:Continuous Vulnerability Management CONTROL:v7 3 DESCRIPTION:Continuous Vulnerability Management;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
      - Unknown
      - Not Applicable
    source:
      benchmark: "CIS Docker Benchmark"
      version: "1.8.0"
      sheet: "Combined Profiles"

  - id: CIS-DOCKER-2-1
    recommendation_id: "2.1"
    severity: High
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "2"
    section_name: "Docker daemon configuration"
    name: "Run the Docker daemon as a non-root user, if possible"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      Rootless mode executes the Docker daemon and containers inside a user namespace, with both the daemon and the container are running without root privileges.
    rationale: |-
      Rootless mode allows running the Docker daemon and containers as a non-root user to mitigate potential vulnerabilities in the daemon and the container runtime.
    impact: |-
      There are multiple prerequisites depending on which distribution that is in use, and also known limitations regarding networking and resource limitation.

      Running in rootless mode also changes the location of any configuration files in use, including all containers using the daemon.
    remediation: |-
      Follow the current Docker documentation on how to install the Docker daemon as a non-root user.
    audit_procedure: |-
      Running the following command will show any running `dockerd` processes and which user that is managing the daemon.

      ```
      ps -fe | grep 'dockerd'
      ```
    cis_controls: |-
      TITLE:Establish and Maintain a Secure Configuration Process CONTROL:v8 4.1 DESCRIPTION:Establish and maintain a secure configuration process for enterprise assets (end-user devices, including portable and mobile, non-computing/IoT devices, and servers) and software (operating systems and applications). Review and update documentation annually, or when significant enterprise changes occur that could impact this Safeguard.;TITLE:Controlled Use of Administrative Privileges CONTROL:v7 4 DESCRIPTION:Controlled Use of Administrative Privileges;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
      - Partial
      - Fail
