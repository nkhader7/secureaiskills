  - id: CIS-DOCKER-5-31
    recommendation_id: "5.31"
    severity: High
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "5"
    section_name: "Container Runtime Configuration"
    name: "Ensure that the host's user namespaces are not shared"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should not share the host's user namespaces with containers running on it.
    rationale: |-
      User namespaces ensure that a root process inside the container will be mapped to a non-root process outside the container. Sharing the user namespaces of the host with the container does not therefore isolate users on the host from users in the containers.
    impact: |-
      None
    remediation: |-
      You should not share user namespaces between host and containers.

      For example, you should not run the command below:
      ```
      docker run --rm -it --userns=host ubuntu bash
      ```
    audit_procedure: |-
      You should run the command below and ensure that it does not return any value for `UsernsMode`. If it returns a value of `host`, it means that the host user namespace is shared with its containers.

      ```
      docker ps --quiet --all | xargs docker inspect --format '{{ .Id }}: UsernsMode={{ .HostConfig.UsernsMode }}'
      ```
    cis_controls: |-
      TITLE:Segment Data Processing and Storage Based on Sensitivity CONTROL:v8 3.12 DESCRIPTION:Segment data processing and storage based on the sensitivity of the data. Do not process sensitive data on enterprise assets intended for lower sensitivity data.;TITLE:Boundary Defense CONTROL:v7 12 DESCRIPTION:Boundary Defense;TITLE:Segment the Network Based on Sensitivity CONTROL:v7 14.1 DESCRIPTION:Segment the network based on the label or classification level of the information stored on the servers, locate all sensitive information on separated Virtual Local Area Networks (VLANs).;
    evidence_examples:
