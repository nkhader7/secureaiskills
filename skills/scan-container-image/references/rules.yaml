  - id: CIS-DOCKER-5-30
    recommendation_id: "5.30"
    severity: High
    category: CIS Docker Benchmark
    profile: "Level 2 - Docker - Linux"
    section_id: "5"
    section_name: "Container Runtime Configuration"
    name: "Ensure that Docker's default bridge \"docker0\" is not used"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      You should not use Docker's default bridge `docker0`. Instead you should use Docker's user-defined networks for container networking.
    rationale: |-
      Docker connects virtual interfaces created in bridge mode to a common bridge called `docker0`. This default networking model is vulnerable to ARP spoofing and MAC flooding attacks as there is no filtering applied to it.
    impact: |-
      User-defined networks need to be configured and managed in line with organizational security policy.
    remediation: |-
      You should follow the Docker documentation and set up a user-defined network. All the containers should be run in this network.
    audit_procedure: |-
      You should run the command below, and verify that containers are on a user-defined network and not the default `docker0` bridge.
      ```
      docker network ls --quiet | xargs docker network inspect --format '{{ .Name }}: {{ .Options }}'
      ```
    cis_controls: |-
      TITLE:Uninstall or Disable Unnecessary Services on Enterprise Assets and Software CONTROL:v8 4.8 DESCRIPTION:Uninstall or disable unnecessary services on enterprise assets and software, such as an unused file sharing service, web application module, or service function.;TITLE:Limitation and Control of Network Ports, Protocols, and Services CONTROL:v6 9 DESCRIPTION:Limitation and Control of Network Ports, Protocols, and Services;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
