  - id: CIS-DOCKER-5-7
    recommendation_id: "5.7"
    severity: Medium
    category: CIS Docker Benchmark
    profile: "Level 1 - Docker - Linux"
    section_id: "5"
    section_name: "Container Runtime Configuration"
    name: "Ensure sshd is not run within containers"
    assessment_status: "Manual"
    match_strategy: cis_docker_review
    description: |-
      The SSH daemon should not be running within the container. You should SSH into the Docker host, and use `docker exec` to enter a container.
    rationale: |-
      Running SSH within the container increases the complexity of security management by making it

      - Difficult to manage access policies and security compliance for SSH server
      - Difficult to manage keys and passwords across various containers
      - Difficult to manage security upgrades for SSH server

      It is possible to have shell access to a container without using SSH, the needlessly increasing the complexity of security management should be avoided.
    impact: |-
      None.
    remediation: |-
      Uninstall the SSH daemon from the container and use and use `docker exec` to enter a container on the remote host.

      ```
      docker exec --interactive --tty <CONTAINER ID> sh
      ```
      OR
      ```
      docker attach <CONTAINER ID>
      ```
    audit_procedure: |-
      List all the running instances of containers by executing below command:
      ```
      docker ps --quiet
      ```

      For each container instance, execute the below command:
      ```
      docker exec <CONTAINER ID> ps -el
      ```
      Ensure that there is no process for SSH server.
    cis_controls: |-
      TITLE:Uninstall or Disable Unnecessary Services on Enterprise Assets and Software CONTROL:v8 4.8 DESCRIPTION:Uninstall or disable unnecessary services on enterprise assets and software, such as an unused file sharing service, web application module, or service function.;TITLE:Ensure Only Approved Ports, Protocols and Services Are Running CONTROL:v7 9.2 DESCRIPTION:Ensure that only network ports, protocols, and services listening on a system with validated business needs, are running on each system.;
    evidence_examples:
      - Dockerfile or container build file
      - Docker daemon configuration
      - Docker Compose or Kubernetes manifest
      - Docker command output
      - Host audit or systemd configuration
    status_values:
      - Pass
