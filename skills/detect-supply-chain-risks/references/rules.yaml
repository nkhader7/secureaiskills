version: "1.0"

source:
  standard: "Software Supply Chain Security"
  focus: "Trust, provenance, integrity, CI/CD, registry, and package-source abuse"

rules:
  - id: SCR-001
    severity: Critical
    category: Dependency Confusion
    name: Detect private package names that may resolve from public registries
    match_strategy: supply_chain_dependency_confusion
    description: >-
      Identify dependencies that appear internal or private but are configured to resolve from a public registry without scoped registry controls.
    evidence_examples:
      - package manager registry config
      - dependency manifest package names
      - private namespace or package scope list
    remediation: >-
      Configure scoped private registries, reserve package names, block public fallback, and require authenticated registry access for internal package scopes.

  - id: SCR-002
    severity: High
    category: Typosquatting
    name: Detect suspiciously similar package names
    match_strategy: supply_chain_typosquatting
    description: >-
      Flag packages whose names are visually or edit-distance similar to common dependencies, internal packages, or organization-owned packages.
    remediation: >-
      Verify publisher identity, package provenance, download source, and repository ownership before use.

  - id: SCR-003
    severity: Critical
    category: CI/CD Integrity
    name: Pin third-party GitHub Actions to immutable commit SHAs
    match_strategy: supply_chain_unpinned_github_actions
    description: >-
      GitHub Actions referenced by tags or branches can change after review and should be pinned to full commit SHAs for high-trust workflows.
    risky_patterns:
      - "uses: owner/action@main"
      - "uses: owner/action@master"
      - "uses: owner/action@v1"
    remediation: >-
      Pin third-party actions to a full-length commit SHA and review updates through dependency automation or explicit pull requests.

  - id: SCR-004
    severity: High
    category: Container Integrity
    name: Pin container images by digest for production deployments
    match_strategy: supply_chain_mutable_container_image
    description: >-
      Mutable image tags such as latest, stable, main, or version-only tags can be retargeted after approval.
    remediation: >-
      Pin production image references to immutable digests and use automation to update digests after image verification.

  - id: SCR-005
    severity: High
    category: Release Integrity
    name: Require signatures or attestations for release artifacts
    match_strategy: supply_chain_unsigned_artifacts
    description: >-
      Release artifacts should have verifiable signatures, attestations, or checksums tied to a trusted identity.
    remediation: >-
      Sign artifacts with an approved signing system and verify signatures before publishing or deployment.

  - id: SCR-006
    severity: High
    category: Provenance
    name: Require build provenance for released artifacts
    match_strategy: supply_chain_missing_provenance
    description: >-
      Released artifacts should include provenance showing source repository, commit, builder identity, and build parameters.
    remediation: >-
      Generate and verify SLSA-style provenance or equivalent attestations for release and deployment artifacts.

  - id: SCR-007
    severity: High
    category: Lockfile Integrity
    name: Require lockfiles for application dependencies
    match_strategy: supply_chain_missing_lockfile
    description: >-
      Missing lockfiles allow dependency versions to drift between review, build, and deployment.
    remediation: >-
      Commit ecosystem-appropriate lockfiles and enforce frozen or clean installs in CI.

  - id: SCR-008
    severity: High
    category: Package Integrity
    name: Verify package integrity hashes where supported
    match_strategy: supply_chain_missing_integrity_hash
    description: >-
      Package manager lockfiles should include integrity hashes or checksums so downloaded packages can be verified.
    remediation: >-
      Regenerate lockfiles with integrity metadata and reject installs when integrity checks fail.

  - id: SCR-009
    severity: Critical
    category: CI/CD Permissions
    name: Minimize CI token permissions
    match_strategy: supply_chain_ci_permissions
    description: >-
      CI workflows should use least-privilege tokens and avoid broad write permissions unless required.
    remediation: >-
      Set explicit read-only defaults and grant write permissions only to jobs that publish trusted artifacts.

  - id: SCR-010
    severity: High
    category: CI/CD Injection
    name: Detect untrusted input reaching shell commands in CI
    match_strategy: supply_chain_ci_injection
    description: >-
      Pull request titles, branch names, issue text, commit messages, and other untrusted fields should not be interpolated directly into shell commands.
    remediation: >-
      Pass untrusted values through environment variables, quote safely, validate inputs, or avoid shell evaluation.

  - id: SCR-011
    severity: High
    category: Install Script Risk
    name: Review package install scripts and lifecycle hooks
    match_strategy: supply_chain_install_scripts
    description: >-
      Package lifecycle scripts such as preinstall, install, postinstall, prepare, setup hooks, and build scripts can execute attacker-controlled code.
    remediation: >-
      Disable scripts where possible, allowlist trusted packages, review lifecycle scripts, and run installs in constrained build environments.

  - id: SCR-012
    severity: High
    category: Registry Trust
    name: Enforce trusted package registries
    match_strategy: supply_chain_registry_trust
    description: >-
      Package managers and build tools should use approved registries and should not silently fall back to public or insecure registries.
    remediation: >-
      Configure registry allowlists, private mirrors, TLS validation, authentication, and package scope routing.

  - id: SCR-013
    severity: Medium
    category: Maintainer Trust
    name: Flag packages with unclear maintainer or source repository identity
    match_strategy: supply_chain_maintainer_identity
    description: >-
      Packages should have a clear publisher, source repository, and release process suitable for the trust level of the application.
    remediation: >-
      Verify maintainer identity, project activity, source repository links, and release history before accepting the package.

  - id: SCR-014
    severity: High
    category: Build Isolation
    name: Build untrusted dependencies in isolated environments
    match_strategy: supply_chain_build_isolation
    description: >-
      Build steps that install or execute third-party code should run in isolated environments without long-lived secrets or broad network access.
    remediation: >-
      Use ephemeral builders, scoped credentials, network egress controls, and secret minimization for dependency installation and build jobs.

  - id: SCR-015
    severity: High
    category: Secret Exposure
    name: Prevent release and build workflows from exposing secrets to untrusted code
    match_strategy: supply_chain_secret_exposure
    description: >-
      Workflows triggered from forks, pull requests, or untrusted branches should not expose deployment credentials, signing keys, or registry tokens.
    remediation: >-
      Restrict secret access by event type, environment protection, branch protection, and manual approvals for privileged release jobs.

  - id: SCR-016
    severity: Medium
    category: Artifact Checksums
    name: Verify downloaded artifacts before execution
    match_strategy: supply_chain_unverified_download
    description: >-
      Scripts should not download and execute remote artifacts without checksum, signature, digest, or pinned immutable source verification.
    remediation: >-
      Pin artifact versions, verify checksums or signatures, and avoid pipe-to-shell installation patterns.

  - id: SCR-017
    severity: Medium
    category: SBOM
    name: Produce SBOMs for release artifacts
    match_strategy: supply_chain_missing_sbom
    description: >-
      Release artifacts and container images should have SBOMs so dependency content can be audited and monitored after release.
    remediation: >-
      Generate CycloneDX or SPDX SBOMs during build and attach them to release or artifact metadata.

  - id: SCR-018
    severity: High
    category: Branch and Tag Protection
    name: Protect release branches and tags
    match_strategy: supply_chain_unprotected_release_refs
    description: >-
      Release branches and tags should require review, protected ref rules, and restricted write access to prevent artifact substitution.
    remediation: >-
      Enable protected branches, protected tags, required reviews, status checks, and release environment approvals.

  - id: SCR-019
    severity: Medium
    category: Dependency Update Governance
    name: Require review for dependency update automation
    match_strategy: supply_chain_dependency_bot_governance
    description: >-
      Automated dependency updates should not auto-merge into sensitive code or release branches without policy checks.
    remediation: >-
      Require CI, approvals, semantic version policies, and security review for high-risk updates.

  - id: SCR-020
    severity: High
    category: Build Reproducibility
    name: Prefer reproducible builds for high-trust artifacts
    match_strategy: supply_chain_reproducible_builds
    description: >-
      High-trust release artifacts should be reproducible or otherwise verifiable against source and build provenance.
    remediation: >-
      Pin build tools, isolate builders, record build parameters, and compare rebuild output or provenance attestations.
